function 确保音响() {

  try {

    低音铺底 = 音响.createOscillator();
    const g = 音响.createGain();
    低音铺底.type = 'sawtooth'; 低音铺底.frequency.value = 42;
    g.gain.value = 0.025;
    低音铺底.connect(g); g.connect(音响.destination);
    低音铺底.start();
  } catch (e) { 音响 = null; }
}
function 播放音(频率列表, 时长 = 0.15, 类型 = 'sine', 音量 = 0.2, 间隔 = 0.09) {
  if (!音响) return;
  频率列表.forEach((频率, 序号) => {
    const 振荡器 = 音响.createOscillator(), 音量控制 = 音响.createGain();
    振荡器.type = 类型; 振荡器.frequency.value = 频率;
    const 开始于 = 音响.currentTime + 序号 * 间隔;
    振荡器.connect(音量控制); 音量控制.connect(音响.destination);
    音量控制.gain.setValueAtTime(音量, 开始于);
    音量控制.gain.exponentialRampToValueAtTime(0.001, 开始于 + 时长);
    振荡器.start(开始于); 振荡器.stop(开始于 + 时长);
  });
}

function 更新逃亡(dt) {

/* ========== 🧭 BFS 寻路 ========== */
function 找路径(起x, 起y, 终x, 终y) {
  const 起格 = [Math.floor(起x), Math.floor(起y)];
  const 终格 = [Math.floor(终x), Math.floor(终y)];
  if (起格[0] === 终格[0] && 起格[1] === 终格[1]) return [];
  const 来路 = {}; const 队列 = [起格];
  来路[起格[0] + ',' + 起格[1]] = null;
  while (队列.length) {
    const [cx, cy] = 队列.shift();
    if (cx === 终格[0] && cy === 终格[1]) break;
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (格子可走(nx, ny) && !(nx + ',' + ny in 来路)) {
        来路[nx + ',' + ny] = [cx, cy];
        队列.push([nx, ny]);
      }
    }
  }
  if (!(终格[0] + ',' + 终格[1] in 来路)) return [];
  const 路径 = []; let 当前 = 终格;
  while (当前) { 路径.unshift({ x: 当前[0] + 0.5, y: 当前[1] + 0.5 }); 当前 = 来路[当前[0] + ',' + 当前[1]]; }
  路径.shift();
  return 路径;
}
function 格子可走(x, y) {
  if (x < 0 || y < 0 || x >= 当前地图宽 || y >= 当前地图高) return false;
  const 字 = 当前地图行[y][x];
  if (字 === '#') return false;
  if (字 === 'C' || 字 === 'M') return false;              // 柜子/镜子挡路
  if (字 === 'T' || 字 === 'V') return false;              // 桌子/售卖机挡路
  if (字 === 'X' && 碎片数 < 3) return false;              // 太平间大门：集齐碎片
  if (字 === 'D' && !门已开) return false;                 // 安全屋门：解开三道锁
  return true;
}
function 一路无阻(ax, ay, bx, by) {   // 两点之间有没有墙
  const dx = bx - ax, dy = by - ay;
  const 距离 = Math.hypot(dx, dy);
  if (距离 < 0.01) return true;
  const 步数 = Math.ceil(距离 * 3);
  for (let i = 1; i < 步数; i++) {
    const t = i / 步数;
    const 字 = 当前地图行[Math.floor(ay + dy * t)][Math.floor(ax + dx * t)];
    if (字 === '#' || 字 === 'C' || 字 === 'M' || 字 === 'X') return false;
  }
  return true;
}

/* ========== 👻 管理员大脑（v2：听得见跑步、看不见下蹲、追瓶子） ========== */
function 随机巡逻点() {
  for (let 试 = 0; 试 < 30; 试++) {
    const x = Math.floor(Math.random() * 地图宽), y = Math.floor(Math.random() * 地图高);
    if (格子可走(x, y) && Math.hypot(x + 0.5 - 玩家x, y + 0.5 - 玩家y) > 4) return { x: x + 0.5, y: y + 0.5 };
  }
  return { x: 12.5, y: 19.5 };
}
function 更新管理员(dt) {
  if (管理员.冷落玩家计时 > 0) 管理员.冷落玩家计时 -= dt;
  const 距玩家 = Math.hypot(玩家x - 管理员.x, 玩家y - 管理员.y);
  // 感知规则（大王的设定）：
  //  蹲着=它看不见你（除非贴脸 1.5 格）；走路 5 格内听见；跑步 8 格内必发现；瓶子优先
  let 看见了 = false;
  if (!倒地 && 管理员.冷落玩家计时 <= 0) {
    if (蹲着 && 距玩家 > 1.5) 看见了 = false;
    else if (管理员.暴走 && 距玩家 < 12) 看见了 = true;
    else if (距玩家 < 2.5) 看见了 = true;
    else {
      const 噪音半径 = 正在跑步 ? 8 : (蹲着 ? 0 : 5);
      if (距玩家 < 噪音半径 && 一路无阻(管理员.x, 管理员.y, 玩家x, 玩家y)) 看见了 = true;
    }
  }
  // 也追队友
  let 追谁 = null;
  if (看见了) 追谁 = { x: 玩家x, y: 玩家y, 是玩家: true };
  else for (const 友 of 队友们) {
    if (友.倒地) continue;
    const d = Math.hypot(友.x - 管理员.x, 友.y - 管理员.y);
    if (d < 6 && 一路无阻(管理员.x, 管理员.y, 友.x, 友.y)) { 追谁 = { x: 友.x, y: 友.y, 是玩家: false, 友 }; break; }
  }
  if (追谁) { 管理员.追击中 = true; 管理员.丢失计时 = 4; 管理员.瓶子目标 = null; }
  else if (管理员.追击中) {
    管理员.丢失计时 -= dt;
    if (管理员.丢失计时 <= 0) 管理员.追击中 = false;
  }
  // 追击起追击乐，甩掉 3 秒后停（v11：正片的呼吸感）
  if (管理员.追击中 && !紧张乐) 启动紧张乐();
  else if (!管理员.追击中 && 紧张乐) { 管理员.静默计时 = (管理员.静默计时 || 3) - dt; if (管理员.静默计时 <= 0) { 停紧张乐(); 管理员.静默计时 = 3; } }
  if (管理员.追击中) 管理员.静默计时 = 3;
  管理员.速度 = 管理员.暴走 ? 管理员暴走速 : (管理员.追击中 || 管理员.瓶子目标 ? 管理员追击速 : 管理员巡逻速);
  // 瓶子：比人优先（丢出去就是为了让它分心）
  if (管理员.瓶子目标) {
    管理员.瓶子计时 -= dt;
    if (管理员.瓶子计时 <= 0 || Math.hypot(管理员.瓶子目标.x - 管理员.x, 管理员.瓶子目标.y - 管理员.y) < 0.7) {
      管理员.瓶子目标 = null;
    }
  }
  管理员.重算计时 -= dt;
  if (管理员.重算计时 <= 0 || 管理员.路径.length === 0) {
    管理员.重算计时 = 0.4;
    let 目标;
    if (管理员.瓶子目标) 目标 = 管理员.瓶子目标;
    else if (管理员.追击中 && 追谁) 目标 = 追谁;
    else if (管理员.追击中) 目标 = { x: 玩家x, y: 玩家y };
    else 目标 = (管理员.目标点 && Math.hypot(管理员.目标点.x - 管理员.x, 管理员.目标点.y - 管理员.y) > 0.6) ? 管理员.目标点 : (管理员.目标点 = 随机巡逻点());
    管理员.路径 = 找路径(管理员.x, 管理员.y, 目标.x, 目标.y);
  }
  if (管理员.路径.length) {
    const 下一 = 管理员.路径[0];
    const dx = 下一.x - 管理员.x, dy = 下一.y - 管理员.y;
    const d = Math.hypot(dx, dy);
    if (d < 0.15) 管理员.路径.shift();
    else {
      管理员.x += dx / d * 管理员.速度 * dt;
      管理员.y += dy / d * 管理员.速度 * dt;
      管理员.朝向角 = Math.atan2(dy, dx);
    }
  }
  // 抓人判定
  if (无敌计时 <= 0 && 管理员.冷落玩家计时 <= 0) {
    if (!倒地 && 距玩家 < 抓人距离) 跳杀触发();
    for (const 友 of 队友们) {
      if (友.倒地) continue;
      if (Math.hypot(友.x - 管理员.x, 友.y - 管理员.y) < 抓人距离) 队友倒地(友);
    }
  }
}

/* ========== 💀 跳杀 & 倒地 & 救援（大王的核心设计） ========== */
let 跳杀对象 = null;
function 跳杀触发() {
  阶段 = '跳杀'; 跳杀计时 = 1.1; 声_被抓(); 抖动 = 16;
  无敌计时 = 2;

function 队友倒地(友) {
  友.倒地 = true; 友.倒地剩余 = 倒地时限; 友.被救进度 = 0;
  管理员.冷落玩家计时 = 0;

}
function 跳杀结算() {   // 跳杀动画放完，分单人/联机两条路
  if (模式 === '联机') {
    倒地 = true; 倒地剩余 = 倒地时限; 救援进度 = 0; 救援者 = null;
    发消息(玩家名 + '倒地了，需要急救！', '#ffd23e', true);
    声_倒地警报();
    阶段 = '倒地';
    管理员.x = 12.5; 管理员.y = 19.5; 管理员.路径 = []; 管理员.追击中 = false;
    管理员.冷落玩家计时 = 12;   // 它以为得手了，逛 12 秒再回来
    setTimeout(() => 队友们.forEach(f => { if (!f.倒地) f.状态 = '救大王'; }), 800);
  } else {
    命数 -= 1;
    玩家x = 出生点.x; 玩家y = 出生点.y;
    管理员.x = 12.5; 管理员.y = 19.5; 管理员.路径 = []; 管理员.追击中 = false; 管理员.冷落玩家计时 = 8;
    if (命数 <= 0) { 阶段 = '失败'; 自动存档(false); }
    else { 阶段 = '玩'; 黑屏计时 = 0.9; 说('它把你拖回了值班室……（命还剩 ' + 命数 + ' 条）', 3); 自动存档(true); }
  }
}
function 更新倒地(dt) {
  倒地剩余 -= dt;
  if (倒地剩余 <= 0) {
    阶段 = '失败'; 自动存档(false);
    return;
  }
  // 爬行
  let 前后 = 0, 左右 = 0, 转 = 0;
  if (按键['w'] || 按键['arrowup']) 前后 += 1;
  if (按键['s'] || 按键['arrowdown']) 前后 -= 1;
  if (按键['a']) 左右 -= 1;
  if (按键['d']) 左右 += 1;
  if (按键['arrowleft']) 转 -= 1;
  if (按键['arrowright']) 转 += 1;
  for (const id in 触点) {
    const t = 触点[id];
    if (t.是左) {
      if (Math.abs(t.位移y) > 8) 前后 -= Math.max(-1, Math.min(1, t.位移y / 40));
      if (Math.abs(t.位移x) > 8) 左右 += Math.max(-1, Math.min(1, t.位移x / 40));
    } else if (Math.abs(t.位移x) > 4) 转 += t.位移x / 60;
  }
  朝向 += 转 * 转头速度 * 0.6 * dt;
  const 走x = Math.cos(朝向) * 前后 + Math.cos(朝向 + Math.PI / 2) * 左右;
  const 走y = Math.sin(朝向) * 前后 + Math.sin(朝向 + Math.PI / 2) * 左右;
  const 步长 = Math.hypot(走x, 走y);
  if (步长 > 0.01) {
    const 速 = 爬速 * dt / 步长;
    撞墙移动(走x * 速, 走y * 速);
  }
  // 谁在救我？
  救援者 = null;
  for (const 友 of 队友们) {
    if (友.倒地) continue;
    const d = Math.hypot(友.x - 玩家x, 友.y - 玩家y);
    if (d < 1.2) { 救援者 = 友; break; }
  }
  if (救援者) {
    救援进度 += dt;
    if (救援进度 >= 救援时长) {
      倒地 = false; 阶段 = '玩'; 耐力 = 60; 无敌计时 = 2;
      声_救起(); 队友说(救援者.名 === undefined ? '' : 救援者.名, '拉起来了！还能走吗？');
      队友们.forEach(f => f.状态 = '跟随');
    }
  } else 救援进度 = Math.max(0, 救援进度 - dt * 2);
}

  const 门锁位 = { x: 10.5, y: 10.5 };

      if (!目标) { 友.状态 = '去开锁'; 友.路径 = []; }
      else if (Math.hypot(友.x - 目标.x, 友.y - 目标.y) < 1.2) {
        友.观察计时 -= dt;
        if (友.观察计时 <= 0) {

          友.观察计时 = 2.2 + Math.random() * 1.8;

      } else {
        友.重算计时 -= dt;
        if (友.重算计时 <= 0 || 友.路径.length === 0) { 友.重算计时 = 0.6; 友.路径 = 找路径(友.x, 友.y, 目标.x, 目标.y); }
        if (友.路径.length) {
          const 下一 = 友.路径[0];
          const dx = 下一.x - 友.x, dy = 下一.y - 友.y;
          const d = Math.hypot(dx, dy);
          if (d < 0.12) 友.路径.shift();
          else { 友.x += dx / d * 1.9 * dt; 友.y += dy / d * 1.9 * dt; }

        if (友.路径.length) {
          const 下一 = 友.路径[0];

          const d = Math.hypot(dx, dy);

      }
    } else if (友.状态 === '试锁') {

        友.状态 = '看你';
      }
    } else if (友.状态 === '看你') {

        if (友.路径.length) {

      说('咔哒——三道锁全开了！推门出去（走近门按 G）', 4);
      发消息('[门锁] 三道锁全部解开！', '#7dff8a', true);
    } else {
      锁面板开 = 下一;
      说('第 ' + n + ' 道锁弹开了……还有下一道', 2.4);
    }
  } else {
    声_锁错(); 锁抖 = 0.5; 锁输入 = '';
  }
}
function 锁键盘(e) {
  if (!锁面板开) return;
  if (e.key === 'Escape') { 锁面板开 = 0; return; }
  if (锁面板开 === 1) return;   // 颜色锁用鼠标点
  const 限长 = 锁面板开 === 2 ? 4 : 3;
  if (/^[0-9]$/.test(e.key) && 锁输入.length < 限长) 锁输入 += e.key;
  else if (e.key === 'Backspace') 锁输入 = 锁输入.slice(0, -1);
  else if (e.key === 'Enter') 检查锁(锁面板开);
}

/* ========== 🎨 渲染 ========== */
const 深度表 = new Float32Array(宽);
/* ---------- 🧊 3D 盒渲染器（v10 大王：任何东西都不是平面） ----------
   一个"盒"= 世界坐标的一块长方体（x0,y0,x1,y1, 下z, 上z，z: 0=地面 1=天花板）。
   逐列求射线与盒的交点：进来的那面决定明暗，绕着走能看到不同侧面——这就是立体。 */
let 本帧视线x = 1, 本帧视线y = 0, 本帧面x = 0, 本帧面y = 0.66;
function 画盒(盒x0, 盒y0, 盒x1, 盒y1, 下z, 上z, 色基, 高亮倍 = 1) {
  for (let x = 0; x < 宽; x++) {
    const 相机x = 2 * x / 宽 - 1;
    const 射x = 本帧视线x + 本帧面x * 相机x, 射y = 本帧视线y + 本帧面y * 相机x;
    let t低 = -1e9, t高 = 1e9, 进面 = 0;
    if (射x !== 0) {
      const t1 = (盒x0 - 玩家x) / 射x, t2 = (盒x1 - 玩家x) / 射x;
      if (t1 > t2) { if (t2 > t低) t低 = t2; if (t1 < t高) t高 = t1; }
      else { if (t1 > t低) { t低 = t1; 进面 = 1; } if (t2 < t高) t高 = t2; }
    }
    if (射y !== 0) {
      const t1 = (盒y0 - 玩家y) / 射y, t2 = (盒y1 - 玩家y) / 射y;
      if (t1 > t2) { if (t2 > t低) t低 = t2; if (t1 < t高) t高 = t1; }
      else { if (t1 > t低) { t低 = t1; 进面 = 2; } if (t2 < t高) t高 = t2; }
    }
    if (t高 <= t低 || t低 <= 0.05) continue;
    if (深度表[x] <= t低) continue;   // 这一列有墙更近
    const 满高 = 高 / t低;
    const 地屏 = 高 / 2 + 满高 / 2;
    const y顶 = 地屏 - 满高 * 上z;
    const y底 = 地屏 - 满高 * 下z;
    if (y顶 > 高 || y底 < 0) continue;
    const 雾 = Math.max(0.08, 1 - t低 / 9) * 高亮倍;
    const 面 = 进面 === 1 ? 0.8 : 1;   // x 面稍暗 → 立体感
    笔.fillStyle = `rgb(${Math.round(色基[0]*雾*面)},${Math.round(色基[1]*雾*面)},${Math.round(色基[2]*雾*面)})`;
    笔.fillRect(x, Math.max(0, y顶), 1, Math.min(高, y底) - Math.max(0, y顶));
  }
}
function 画盒顶边(盒x0, 盒y0, 盒x1, 盒y1, 上z, 色) {
  画盒(盒x0, 盒y0, 盒x1, 盒y1, 上z - 0.03, 上z, 色, 1.25);
}
function 渲染(t) {
  笔.fillStyle = '#07030a'; 笔.fillRect(0, 0, 宽, 高);
  if (阶段 === '起名') 画起名(t);
  else if (阶段 === '玩' || 阶段 === '倒地') 渲染世界(t);
  else if (阶段 === '跳杀') 画跳杀(t);
  else if (阶段 === '主页') 画主页(t);
  else if (阶段 === '单人菜单') 画单人菜单();
  else if (阶段 === '联机菜单') 画联机菜单();
  else if (阶段 === '房间') 画房间(t);
  else if (阶段 === '介绍') 画介绍();
  else if (阶段 === '过场') 画过场(t);
  else if (阶段 === '段落完') 画段落完(t);
  else if (阶段 === '结局') 画结局(t);
  else if (阶段 === '失败') 画失败();
  else if (阶段 === '过关') 画过关(t);
  if (抖动 > 0) 抖动 = Math.max(0, 抖动 - 0.8);
  if (['玩', '倒地'].includes(阶段)) { 画消息区(); }
}

function 渲染世界(t) {
  const 抖 = 抖动 > 0 ? (Math.random() - 0.5) * 抖动 : 0;
  笔.save();
  笔.translate(抖, 抖 * 0.6 + (蹲着 ? 14 : 0) + 跳跃相位 * 44);   // 蹲=视角压低；跳=人物上移（画面下沉）
  if (翻滚相位 > 0) {   // 前滚翻：整个画面绕中心转 360°
    笔.translate(宽 / 2, 高 / 2);
    笔.rotate((1 - 翻滚相位) * Math.PI * 2);
    笔.translate(-宽 / 2, -高 / 2);
  }
  const 地平偏 = -跳跃相位 * 30;   // 跳起来时视线上抬
  let 渐变 = 笔.createLinearGradient(0, 0, 0, 高 / 2 + 地平偏);
  if (场景 === '安全屋') { 渐变.addColorStop(0, '#3a3c42'); 渐变.addColorStop(1, '#8a8c92'); }
  else { 渐变.addColorStop(0, '#04060a'); 渐变.addColorStop(1, '#0d141c'); }
  笔.fillStyle = 渐变; 笔.fillRect(0, 0, 宽, 高);
  渐变 = 笔.createLinearGradient(0, 高 / 2 + 地平偏, 0, 高);
  if (场景 === '安全屋') { 渐变.addColorStop(0, '#8a8c92'); 渐变.addColorStop(1, '#b8bac0'); }
  else { 渐变.addColorStop(0, '#0d141c'); 渐变.addColorStop(1, '#1a2430'); }
  笔.fillStyle = 渐变; 笔.fillRect(0, 高 / 2, 宽, 高 / 2);

  镜头张角 += ((开镜中 ? (有瞄准镜 ? 0.18 : 0.26) : 视野张角) - 镜头张角) * 0.25;   // 开镜=拉近镜头
  const 视线x = Math.cos(朝向), 视线y = Math.sin(朝向);
  const 屏幕面x = -视线y * 镜头张角, 屏幕面y = 视线x * 镜头张角;
  本帧视线x = 视线x; 本帧视线y = 视线y; 本帧面x = 屏幕面x; 本帧面y = 屏幕面y;

  for (let x = 0; x < 宽; x++) {
    const 相机x = 2 * x / 宽 - 1;
    const 射x = 视线x + 屏幕面x * 相机x, 射y = 视线y + 屏幕面y * 相机x;
    let 地图x = Math.floor(玩家x), 地图y = Math.floor(玩家y);
    const 步x = 射x === 0 ? 1e30 : Math.abs(1 / 射x), 步y = 射y === 0 ? 1e30 : Math.abs(1 / 射y);
    let 侧距x, 侧距y, 走x, 走y;
    if (射x < 0) { 走x = -1; 侧距x = (玩家x - 地图x) * 步x; } else { 走x = 1; 侧距x = (地图x + 1 - 玩家x) * 步x; }
    if (射y < 0) { 走y = -1; 侧距y = (玩家y - 地图y) * 步y; } else { 走y = 1; 侧距y = (地图y + 1 - 玩家y) * 步y; }
    let 撞 = 0, 侧面 = 0, 撞字 = '#';
    while (!撞) {
      if (侧距x < 侧距y) { 侧距x += 步x; 地图x += 走x; 侧面 = 0; }
      else { 侧距y += 步y; 地图y += 走y; 侧面 = 1; }
      if (地图x < 0 || 地图y < 0 || 地图x >= 当前地图宽 || 地图y >= 当前地图高) { 撞字 = '#'; break; }
      撞字 = 当前地图行[地图y][地图x];
      if (撞字 !== '.') 撞 = 1;
    }
    const 垂直距 = Math.max(0.01, 侧面 === 0 ? 侧距x - 步x : 侧距y - 步y);
    深度表[x] = 垂直距;
    const 满高 = Math.min(高 * 1.8, 高 / 垂直距);
    let 墙高 = 满高;
    let 顶 = 高 / 2 + 地平偏 - 墙高 / 2;
    if (撞字 === 'V') { 墙高 = 满高 * 0.72; 顶 = 高 / 2 + 地平偏 + 满高 / 2 - 墙高; }   // 售卖机：矮一档，脚贴地
    let 墙纹 = 侧面 === 0 ? 玩家y + 垂直距 * 射y : 玩家x + 垂直距 * 射x;
    墙纹 -= Math.floor(墙纹);
    if (撞字 === 'M') 画镜面(x, 顶, 墙高, 墙纹, 垂直距, t);
    else if (撞字 === 'X') 画大门(x, 顶, 墙高, 墙纹, 垂直距, t);
    else if (撞字 === 'D') 画安保室门(x, 顶, 墙高, 墙纹, 垂直距, t);
    else if (场景 === '安全屋' && 撞字 === 'T') 画家具体(x, 顶, 墙高, 墙纹, '桌', 垂直距, 侧面);
    else if (场景 === '安全屋' && 撞字 === 'C') 画家具体(x, 顶, 墙高, 墙纹, '椅', 垂直距, 侧面);
    else if (场景 === '安全屋' && 撞字 === 'V') 画家具体(x, 顶, 墙高, 墙纹, '售卖机', 垂直距, 侧面);
    else if (场景 === '安全屋') 画白墙(x, 顶, 墙高, 墙纹, 垂直距, 侧面);
    else 画瓷砖墙(x, 顶, 墙高, 墙纹, 垂直距, 侧面);
  }

  const 精灵 = [];
  if (场景 === '安全屋') {
    for (const 具 of 安全家具们) 精灵.push({ 型: 具.型 === '售卖机' ? '柜子' : (具.型 === '桌' ? '桌子' : '椅子'), x: 具.x, y: 具.y });
    // 墙上四幅编号画（浮空看板）
    精灵.push({ 型: '画', x: 3.5, y: 1.35, 号: 1, 色: '#5a9dff', 名: '蓝天' });
    精灵.push({ 型: '画', x: 4.5, y: 1.35, 号: 2, 色: '#a86cf5', 名: '葡萄' });
    精灵.push({ 型: '画', x: 5.5, y: 1.35, 号: 3, 色: '#ff5d7a', 名: '红花' });
    精灵.push({ 型: '画', x: 6.5, y: 1.35, 号: 4, 色: '#ffd23e', 名: '柠檬' });
    精灵.push({ 型: '纸条', x: 2.5, y: 9.35 });
    for (const 友 of 队友们) 精灵.push({ 型: '队友', x: 友.x, y: 友.y, 友 });
    if (紫外模式) 精灵.push({ 型: '荧光字', x: 9.5, y: 5.62, 文: '7 3 1 9' });   // 售卖机上方墙面，紫外才看得见
  } else {
    for (const 碎 of 碎片们) if (!碎.已捡) 精灵.push({ 型: '碎片', x: 碎.x, y: 碎.y });
    for (const 电 of 电池们) if (!电.已捡) 精灵.push({ 型: '电池', x: 电.x, y: 电.y });
    for (const 瓶 of 瓶子们) 精灵.push({ 型: '瓶子', x: 瓶.x, y: 瓶.y });
    for (const 柜 of 柜子们) 精灵.push({ 型: '柜子', x: 柜.x, y: 柜.y, 柜 });
    for (const 友 of 队友们) 精灵.push({ 型: '队友', x: 友.x, y: 友.y, 友 });
    if (交互点们[0] && !有散弹枪) 精灵.push({ 型: '枪', x: 交互点们[0].x, y: 交互点们[0].y });
    if (交互点们[1] && !有冲锋枪) 精灵.push({ 型: '冲锋枪', x: 交互点们[1].x, y: 交互点们[1].y });
    if (交互点们[2] && !交互点们[2].拿走) 精灵.push({ 型: '弹盒', x: 交互点们[2].x, y: 交互点们[2].y });
    if (交互点们[3] && !交互点们[3].拿走) 精灵.push({ 型: '弹盒', x: 交互点们[3].x, y: 交互点们[3].y });
    if (交互点们[4] && !有瞄准镜) 精灵.push({ 型: '镜片', x: 交互点们[4].x, y: 交互点们[4].y });
    if (紫外模式) 精灵.push({ 型: '荧光字', x: 3.5, y: 18.4, 文: '它在学你' });   // 镜子旁的涂鸦
    if (管理员 && 重组计时 <= 0) 精灵.push({ 型: '管理员', x: 管理员.x, y: 管理员.y });
  }
  精灵.sort((a, b) => (Math.hypot(b.x - 玩家x, b.y - 玩家y) - Math.hypot(a.x - 玩家x, a.y - 玩家y)));
  for (const 灵 of 精灵) 画精灵(灵, 视线x, 视线y, 屏幕面x, 屏幕面y, t);

  let 光强 = !手电开着 ? 0.06 : (电量 / 100) * (1 - 手电最暗) + 手电最暗;
  if (场景 === '安全屋') 光强 = Math.max(光强, 手电开着 ? 0.5 : 0.22);   // 白色安保室，本来就亮
  const 闪 = 手电开着 && 电量 < 22 ? (0.55 + 0.45 * Math.sin(t * 0.02) * Math.sin(t * 0.013)) : (手电开着 ? 1 : 0.5);
  const 半径 = 高 * (0.42 + 0.25 * 光强 * 闪) * (紫外模式 ? 0.8 : 1);
  const 光圈 = 笔.createRadialGradient(宽 / 2, 高 / 2, 半径 * 0.18, 宽 / 2, 高 / 2, 半径);
  光圈.addColorStop(0, 紫外模式 ? 'rgba(30,0,50,0)' : 'rgba(0,0,0,0)');
  光圈.addColorStop(0.62, 紫外模式 ? 'rgba(18,0,32,' + (0.5 * 灯闪系数).toFixed(3) + ')' : 'rgba(0,0,0,' + (0.35 * 灯闪系数).toFixed(3) + ')');
  光圈.addColorStop(1, 紫外模式 ? 'rgba(8,0,16,' + Math.min(1, 0.98 * 灯闪系数 + 0.4).toFixed(3) + ')' : 'rgba(2,3,6,' + Math.min(1, 0.96 * 灯闪系数 + 0.5).toFixed(3) + ')');
  笔.fillStyle = 光圈; 笔.fillRect(0, 0, 宽, 高);
  笔.restore();
  // 紫外模式整屏紫染
  if (紫外模式 && 手电开着) { 笔.fillStyle = 'rgba(70,20,120,0.14)'; 笔.fillRect(0, 0, 宽, 高); }

  if (倒地) {   // 倒地：画面贴地 + 边缘红 + 第三人称雷达
    笔.fillStyle = 'rgba(60,0,0,0.28)'; 笔.fillRect(0, 0, 宽, 高);
    画雷达(t);
  }
  if (转场计时 > 0) {
    笔.fillStyle = 'rgba(2,1,3,' + Math.min(1, 1.2 - Math.abs(转场计时 - 1.1)).toFixed(2) + ')';
    笔.fillRect(0, 0, 宽, 高);
    笔.font = 'bold 15px system-ui, "PingFang SC", sans-serif';
    笔.textAlign = 'center'; 笔.fillStyle = '#c9b8bd';
    笔.fillText(转场文, 宽 / 2, 高 / 2 - 10);
    笔.fillText(转场计时 > 1.1 ? '' : '外面，是地下太平间的走廊……', 宽 / 2, 高 / 2 + 16);
  }
  if (!倒地 && 转场计时 <= 0) {
    // 准星 / 开镜
    if (开镜中) {
      if (有瞄准镜) {   // 圆形镜片视野
        笔.fillStyle = 'rgba(0,0,0,0.92)';
        笔.beginPath();
        笔.rect(0, 0, 宽, 高);
        笔.arc(宽 / 2, 高 / 2, 高 * 0.44, 0, Math.PI * 2, true);
        笔.fill();
        笔.strokeStyle = 'rgba(120,200,255,0.5)'; 笔.lineWidth = 2;
        笔.beginPath(); 笔.arc(宽 / 2, 高 / 2, 高 * 0.44, 0, Math.PI * 2); 笔.stroke();
      }
      笔.strokeStyle = 'rgba(255,255,255,0.85)'; 笔.lineWidth = 1;
      笔.beginPath();
      笔.moveTo(宽 / 2 - 14, 高 / 2); 笔.lineTo(宽 / 2 - 4, 高 / 2);
      笔.moveTo(宽 / 2 + 4, 高 / 2); 笔.lineTo(宽 / 2 + 14, 高 / 2);
      笔.moveTo(宽 / 2, 高 / 2 - 14); 笔.lineTo(宽 / 2, 高 / 2 - 4);

    笔.fillStyle = '#bfffc9'; 笔.fillText(救援者.名 + ' 正在救你…按住别动', cx, 高 / 2 + R + 30);

}

/* ---------- HUD & 消息区 ---------- */
function 画HUD(t) {
  if (阶段 !== '玩' && 阶段 !== '倒地') return;
  笔.font = 'bold 14px system-ui, "PingFang SC", sans-serif';
  笔.textAlign = 'left';
  if (模式 === '单人') {
    笔.fillStyle = '#ff5d7a';
    笔.fillText('❤️'.repeat(Math.max(0, 命数)), 10, 22);
  } else {
    笔.fillStyle = '#9fd4ff';
    笔.fillText('房间 ' + 房间号, 10, 22);
  }
  笔.textAlign = 'right';
  let 碎字 = '';
  for (let i = 0; i < 3; i++) 碎字 += i < 碎片数 ? '🔹' : '◇';
  笔.fillStyle = 碎片数 >= 3 ? '#bffaff' : '#9fb8c4';
  笔.fillText(碎字 + ' ' + 碎片数 + '/3　🍾×' + 瓶子数 + '　', 宽 - 10, 22);
  // 武器栏（v5：三把枪）
  笔.font = 'bold 11px system-ui, "PingFang SC", sans-serif';
  笔.textAlign = 'left';
  const 枪们 = [
    { 名: '🔫手枪∞', 有: true },
    { 名: '🎯散弹×' + 高级弹, 有: 有散弹枪 },
    { 名: '⛏冲锋' + (有冲锋枪 ? 冲锋弹匣 + '/' + 冲锋备弹 : '—'), 有: 有冲锋枪 },
  ];
  let 枪x = 10;
  枪们.forEach((g, i) => {
    if (!g.有) { if (i !== 当前枪) return; }
    笔.fillStyle = i === 当前枪 ? '#ffe2b8' : '#8a7a6a';
    笔.fillText((i === 当前枪 ? '▸' : ' ') + g.名, 枪x, 40);
    枪x += 笔.measureText((i === 当前枪 ? '▸' : ' ') + g.名).width + 10;
  });
  if (换弹计时 > 0) {
    笔.fillStyle = 'rgba(0,0,0,0.6)'; 笔.fillRect(10, 46, 90, 8);
    笔.fillStyle = '#ffd23e'; 笔.fillRect(11, 47, 88 * (1 - 换弹计时 / 换弹秒), 6);
    笔.font = '10px system-ui, "PingFang SC", sans-serif';
    笔.fillStyle = '#ffd23e'; 笔.fillText('换弹中…', 104, 54);
  }
  笔.fillStyle = 手电开着 ? (紫外模式 ? '#c9a3ff' : '#ffe9a0') : '#5a5a62';
  笔.fillText(紫外模式 ? '🔦🟣' : (手电开着 ? '🔦' : ' 🔦关'), 10, 56);
  // 交互提示（G 键）
  if (交互提示文 && 阶段 === '玩' && !锁面板开 && !背包开) {
    笔.font = 'bold 13px system-ui, "PingFang SC", sans-serif';
    笔.textAlign = 'center';
    const 提示宽 = 笔.measureText('⟨G⟩ ' + 交互提示文).width;
    笔.fillStyle = 'rgba(6,8,12,0.7)';
    笔.fillRect(宽 / 2 - 提示宽 / 2 - 10, 高 - 118, 提示宽 + 20, 20);
    笔.fillStyle = '#ffd23e';
    笔.fillText('⟨G⟩ ' + 交互提示文, 宽 / 2, 高 - 104);
  }
  // 手电电量条
  const 条宽 = 110, 条x = 宽 / 2 - 条宽 / 2, 条y = 高 - 16;
  笔.fillStyle = 'rgba(0,0,0,0.5)'; 笔.fillRect(条x - 2, 条y - 2, 条宽 + 4, 10);
  笔.fillStyle = 电量 < 22 ? (Math.sin(t * 0.012) > 0 ? '#ff9b3d' : '#7a4a1e') : '#ffd23e';
  笔.fillRect(条x, 条y, 条宽 * 电量 / 100, 6);
  // 耐力条（跑步用）
  笔.fillStyle = 'rgba(0,0,0,0.5)'; 笔.fillRect(条x - 2, 条y - 12, 条宽 + 4, 8);
  笔.fillStyle = 耐力 < 20 ? '#ff7a5d' : '#7dff8a';
  笔.fillRect(条x, 条y - 10, 条宽 * 耐力 / 100, 4);
  笔.font = '10px system-ui, "PingFang SC", sans-serif';
  笔.textAlign = 'center'; 笔.fillStyle = '#cfe8dd';
  笔.fillText('🔦 手电', 宽 / 2, 条y - 16);
  // 蹲下提示
  if (蹲着 && 阶段 === '玩') {
    笔.font = 'bold 11px system-ui, "PingFang SC", sans-serif';
    笔.fillStyle = '#9fd4ff';
    笔.fillText('🦫 蹲着：没声音，它看不见你', 宽 / 2, 40);
  }
  // 救人提示（附近有倒地队友）
  if (阶段 === '玩') {
    const 伤员 = 队友们.find(f => f.倒地);
    if (伤员) {
      const d = Math.hypot(伤员.x - 玩家x, 伤员.y - 玩家y);
      if (d < 6) {
        笔.font = 'bold 12px system-ui, "PingFang SC", sans-serif';
        笔.fillStyle = '#ffd23e';
        笔.fillText(d < 1.2 ? (蹲着 ? '按住 O 救 ' + 伤员.名 + '…' : '靠近点，蹲下（C）再按住 O 救 ' + 伤员.名) : ('⚠ ' + 伤员.名 + ' 倒地了，去救他！'), 宽 / 2, 58);
        if (d < 1.2 && 蹲着 && 想按O) {
          笔.fillStyle = 'rgba(0,0,0,0.6)'; 笔.fillRect(宽 / 2 - 50, 64, 100, 10);
          笔.fillStyle = '#7dff8a'; 笔.fillRect(宽 / 2 - 48, 66, 96 * Math.min(1, 伤员.被救进度 / 救援时长), 6);
        }
      }
    }
  }
  // 字幕
  if (!当前字幕 && 字幕队列.length) { 当前字幕 = 字幕队列.shift(); 字幕计时 = 当前字幕.时长; }
  if (当前字幕) {
    字幕计时 -= 1 / 60;
    const 透明 = Math.min(1, 字幕计时 * 2, (当前字幕.时长 - 字幕计时) * 3);
    笔.fillStyle = `rgba(6,8,12,${(0.62 * 透明).toFixed(2)})`;
    笔.font = 'bold 13px system-ui, "PingFang SC", sans-serif';
    const 宽度 = 笔.measureText(当前字幕.文本).width;
    笔.fillRect(宽 / 2 - 宽度 / 2 - 10, 高 - 96, 宽度 + 20, 22);
    笔.fillStyle = `rgba(235,248,255,${透明.toFixed(2)})`;
    笔.fillText(当前字幕.文本, 宽 / 2, 高 - 81);
    if (字幕计时 <= 0) 当前字幕 = null;
  }
  // 手机动作钮
  if (阶段 === '玩') {
    for (const 钮 of 触钮) {
      笔.fillStyle = 'rgba(16,6,10,0.72)';
      笔.beginPath(); 笔.arc(钮.x, 钮.y, 钮.r, 0, Math.PI * 2); 笔.fill();
      笔.strokeStyle = (钮.名 === '蹲' && 蹲着) ? '#7de8ff' : 'rgba(194,48,70,0.8)';
      笔.lineWidth = 2; 笔.stroke();
      笔.font = '13px system-ui'; 笔.textAlign = 'center'; 笔.fillStyle = '#e8c9cd';
      笔.fillText(钮.字, 钮.x, 钮.y + 5);
    }
  }
}
function 画消息区() {   // 固定左下角，全员可见
  笔.font = '12px system-ui, "PingFang SC", sans-serif';
  笔.textAlign = 'left';
  let y = 高 - 14;
  for (let i = 消息们.length - 1; i >= 0 && i >= 消息们.length - 5; i--) {
    const 息 = 消息们[i];
    const 透明 = Math.min(1, 息.生);
    const 宽度 = 笔.measureText(息.文本).width;
    笔.fillStyle = `rgba(5,2,6,${(0.55 * 透明).toFixed(2)})`;
    笔.fillRect(8, y - 12, 宽度 + 10, 16);
    笔.fillStyle = 息.色.startsWith('#') ? 息.色 : 息.色;
    笔.globalAlpha = 透明;
    笔.fillText(息.文本, 13, y);
    笔.globalAlpha = 1;
    y -= 19;
  }
}

        发消息('[系统] 已加入愿望单！正式版出来第一时间通知你 ⚡', '#ffd23e', true);
      }, '#c2a23e');
    } else {
      笔.font = 'bold 14px system-ui, "PingFang SC", sans-serif';
      笔.fillStyle = '#ffd23e';
      笔.fillText('❤ 已在愿望单——正式版见！', 宽 / 2, 243);
    }
    按钮('↩ 回主页', 宽 / 2 - 110, 高 - 34, 220, 26, () => { 阶段 = '主页'; }, '#8a4a5a');
    笔.font = '10px system-ui, "PingFang SC", sans-serif';
    笔.fillStyle = '#5a3d45';

  }
}
function 画失败() {
  笔.fillStyle = '#070308'; 笔.fillRect(0, 0, 宽, 高);
  按钮们.length = 0;
  大字('眼前一黑……', 80, 30, '#ff5d7a');
  笔.font = '13px system-ui, "PingFang SC", sans-serif';

  const 文 = 模式 === '联机'
    ? ['60 秒到了，小队没能把 ' + 玩家名 + ' 拉起来……', '镜子碎片散落一地。但值班室的灯还亮着。']
    : ['影子管理员把你"请"出了地下走廊。', '镜子碎片散落一地……但值班室的灯还亮着。'];

  按钮('↩ 回主页', 宽 / 2 - 110, 高 - 40, 220, 30, () => { 阶段 = '主页'; }, '#8a4a5a');
}
function 画过关(t) {
  const 亮 = 0.9 + 0.1 * Math.sin(t * 0.004);
  笔.fillStyle = `rgba(220,244,255,${(亮 * 0.14).toFixed(3)})`;

  笔.fillText('⏱ 用时 ' + Math.floor(用时) + ' 秒' + (模式 === '联机' ? '　　👥 全队生还' : ''), 宽 / 2, 128);
  if (最佳秒数 > 0) 笔.fillText('🏆 最佳纪录：' + 最佳秒数 + ' 秒', 宽 / 2, 150);

  按钮('↩ 回主页', 宽 / 2 - 110, 高 - 40, 220, 30, () => { 阶段 = '主页'; }, '#8a4a5a');
}
function 发界面提示(文) { 消息们.push({ 文本: '[提示] ' + 文, 色: '#ffd23e', 生: 4 }); }
function 开始玩() {
  确保音响();
  if (阶段 === '介绍' || 阶段 === '房间') 装载安全屋();
  消息们 = [];
  阶段 = '玩';
  if (低音铺底 && 音响) 低音铺底.frequency.setTargetAtTime(42, 音响.currentTime, 0.5);
  说('醒了……这里是安保室。门上锁了三道锁。', 3.6);
  setTimeout(() => { if (阶段 === '玩' && 场景 === '安全屋') 说('按 Q 开手电，按 G 和东西互动。线索就在安保室里。', 4); }, 4000);
  if (模式 === '联机') {
    const 开场词们 = ['这就是安保室？行吧……我先转转看看有没有线索。', '哇，这屋子白得晃眼，你们小心别撞墙。', '我先声明：锁我肯定解不开，但我嘴巴甜会加油。'];
    队友们.forEach((友, i) => setTimeout(() => { if (场景 === '安全屋' && 阶段 === '玩') 队友说(友.名, 开场词们[i % 3]); }, 1600 + i * 900));
  }
}

/* ========== ⏱ 主循环 ========== */
let 上一刻 = performance.now();
let 时钟刻 = 0;
function 帧(此刻) {
  const dt = Math.min(0.05, (此刻 - 上一刻) / 1000);
  上一刻 = 此刻;
  时钟刻 = 此刻;
  for (const 息 of 消息们) 息.生 -= dt / 1;
  消息们 = 消息们.filter(m => m.生 > 0);
  if (邀请等待) {
    邀请等待.计时 -= dt;
    if (邀请等待.计时 <= 0) { const 友 = 邀请等待.友; 邀请等待 = null; 邀请结算(友); }
  }
  邀请结果计时 = Math.max(0, 邀请结果计时 - dt);
  队友回复冷却 = Math.max(0, 队友回复冷却 - dt);

  if (阶段 === '玩') {
    用时 += dt;
    无敌计时 = Math.max(0, 无敌计时 - dt);
    枪口火 = Math.max(0, 枪口火 - dt);
    后坐 = Math.max(0, 后坐 - dt * 6);
    命中闪 = Math.max(0, 命中闪 - dt * 3);
    武器冷却 = Math.max(0, 武器冷却 - dt);
    if (换弹计时 > 0) {
      换弹计时 -= dt;
      if (换弹计时 <= 0) 完成换弹();
    } else if (开火按住 && 当前枪 === 2) 开火();   // 冲锋枪按住连发
    锁抖 = Math.max(0, 锁抖 - dt);
    水机冷却 = Math.max(0, 水机冷却 - dt);
    if (手电开着) 电量 = Math.max(0, 电量 - 手电耗电 * dt);
    if (转场计时 > 0) {
      转场计时 -= dt;
      if (转场计时 <= 0) {
        转场计时 = 0;   // v11 修：清掉浮点残渣，防重复触发
        if (场景 === '走廊') { 装载太平间(模式 === '联机'); }
        else if (场景 === '安全屋') { 装载走廊(); }
        else {
          装载太平间(模式 === '联机');
          说('这里是地下走廊。手电筒别关。', 3.2);
          if (模式 === '联机') setTimeout(() => { if (队友们[0]) 队友说(队友们[0].名, '都跟紧了，手电省着用。'); }, 1600);
          setTimeout(() => { if (阶段 === '玩') 说('（值班本：别盯着镜子里的自己看太久）', 3.2); }, 3600);
        }
      }
    } else if (锁面板开 || 背包开 || 好友面板开) {
      // 解锁/背包/好友面板时世界暂停
    } else if (黑屏计时 > 0) {
      黑屏计时 -= dt;
    } else if (场景 === '安全屋') {
      安保室用时 += dt;
      更新玩家(dt);
      更新交互提示();
      更新安保室AI(dt);
      氛围更新(dt);
    } else if (场景 === '走廊') {
      更新玩家(dt);
      更新交互提示();
      更新逃亡(dt);
      无敌计时 = Math.max(0, 无敌计时 - 0);   // 无敌在通用区已减
    } else {
      更新玩家(dt);
      更新交互提示();
      if (重组计时 > 0) {
        重组计时 -= dt;
        if (重组计时 <= 0) 重组();
      } else {
        更新管理员(dt);
      }
      更新队友(dt);
      更新物品(dt);
      // 玩家救人：靠近 + 蹲下 + 长按 O
      const 伤员 = 队友们.find(f => f.倒地);
      if (伤员 && 蹲着 && 想按O && Math.hypot(伤员.x - 玩家x, 伤员.y - 玩家y) < 1.2) {
        伤员.被救进度 += dt;
        if (伤员.被救进度 >= 救援时长) {
          伤员.倒地 = false; 伤员.被救进度 = 0;
          声_救起(); 发消息('[系统] ' + 玩家名 + ' 把 ' + 伤员.名 + ' 救起来了！', '#7dff8a', true);
        }
      }
      氛围更新(dt);
    }
  } else if (阶段 === '过场') {
    过场推进(dt);
  } else if (阶段 === '段落完') {
    段落完计时 += dt;
  } else if (阶段 === '结局') {
    结局计时 += dt;
    // 相位：0 渐黑1.5s → 1 寂静2s → 2 "门外，一阵死寂。"3.5s → 3 淡出1s → 4 结束卡
    if (结局相位 === 0 && 结局计时 > 1.5) { 结局相位 = 1; 结局计时 = 0; }
    else if (结局相位 === 1 && 结局计时 > 2) { 结局相位 = 2; 结局计时 = 0; }
    else if (结局相位 === 2 && 结局计时 > 3.5) { 结局相位 = 3; 结局计时 = 0; }
    else if (结局相位 === 3 && 结局计时 > 1) { 结局相位 = 4; 结局计时 = 0; 声_过关(); }
  } else if (阶段 === '倒地') {
    无敌计时 = Math.max(0, 无敌计时 - dt);
    更新倒地(dt);
    更新队友(dt);
    更新管理员(dt);
    氛围更新(dt);
  } else if (阶段 === '被抓') {
    黑屏计时 -= dt;
    if (黑屏计时 <= 0) { 阶段 = '玩'; 黑屏计时 = 0; }
  }
  渲染(此刻);
  if (锁面板开) { 按钮们.length = 0; 画锁面板(时钟刻); }
  else if (背包开) { 按钮们.length = 0; 画背包(); }
  else if (好友面板开) { 画好友面板(时钟刻); 按钮们.length = 0; 画好友面板(时钟刻); }
  // 右上角 👥 好友入口（起名时不显示）
  if (阶段 !== '起名' && !锁面板开 && !背包开 && !好友面板开) {
    const 在线数 = 好友列表.filter(f => {
      const 员 = 测试队员.find(z => z.id === f.id);
      return 员 ? 队员在线(员) : false;
    }).length;
    笔.fillStyle = 'rgba(16,6,10,0.85)';
    笔.beginPath(); 笔.arc(宽 - 26, 26, 15, 0, Math.PI * 2); 笔.fill();
    笔.strokeStyle = 在线数 > 0 ? '#7dff8a' : '#8a4a5a'; 笔.lineWidth = 2; 笔.stroke();
    笔.font = '14px system-ui'; 笔.textAlign = 'center';
    笔.fillStyle = '#ffd9df'; 笔.fillText('👥', 宽 - 26, 31);
    if (在线数 > 0) {   // 有好友在线的小绿点
      笔.fillStyle = '#7dff8a';
      笔.beginPath(); 笔.arc(宽 - 15, 16, 3.5, 0, Math.PI * 2); 笔.fill();
    }
  }
  requestAnimationFrame(帧);
}
function 氛围更新(dt) {
  const 距 = 管理员 ? Math.hypot(玩家x - 管理员.x, 玩家y - 管理员.y) : 99;
  const 危险 = Math.max(0, 1 - 距 / 8);
  心跳计时 -= dt;
  if (心跳计时 <= 0 && 危险 > 0.05) { 声_心跳(); 心跳计时 = 1.5 - 危险 * 1.15; }
  灯闪计时 -= dt;
  if (灯闪计时 <= 0) { 灯闪计时 = 4 + Math.random() * 7; 灯闪系数 = 0.35; }
  else if (灯闪系数 < 1) 灯闪系数 = Math.min(1, 灯闪系数 + dt * 2.4);
  下次吱呀 -= dt;
  if (下次吱呀 <= 0) {
    下次吱呀 = 8 + Math.random() * 12;
    let 最近的 = null, 最近距 = 99;
    for (const 柜 of 柜子们) {
      const d = Math.hypot(柜.x - 玩家x, 柜.y - 玩家y);
      if (d < 最近距) { 最近距 = d; 最近的 = 柜; }
    }
    if (最近的 && 最近距 < 5) {
      声_吱呀(); 最近的.开着 = 1;
      if (最近距 < 2.6) 说('……几号柜的门，自己开了。');
    }
  }
  for (const 柜 of 柜子们) 柜.开着 = Math.max(0, 柜.开着 - dt * 0.5);
}

/* 动作键（C/V/O 之外的 keydown 在上面统一监听，这里分发） */
addEventListener('keydown', e => {
  if (document.activeElement === 聊天框 || document.activeElement === 房间号框) return;
  动作键处理(e.key);
});

/* ========== 🪪 首次登录：起名字 + 发终身 ID ========== */
const 随机名字表 = [
  '夜枭', '小钢炮', '糖豆', '影子', '闪电', '雾灯', '黑猫', '橘子汽水', '白鸦', '过山车',
];
let 我的临时ID = 发新ID();
if (!我的档案) {
  阶段 = '起名';
  起名框.style.display = 'block';
  起名框.value = '';
  起名框.focus();
  // 回车 = 用当前名字登录
  起名框.addEventListener('keydown', e => {
    e.stopPropagation();
    if (e.key === 'Enter') 登录起名(起名框.value.trim());
  });
} else {
  玩家名 = 我的档案.名;
}
function 登录起名(名) {
  if (!名) { 名 = 随机名字表[Math.floor(Math.random() * 随机名字表.length)]; }
  名 = 名.slice(0, 8);
  我的档案 = { 名, id: 我的临时ID, 建档: new Date().toLocaleDateString() };
  localStorage.setItem('镜中人_玩家', JSON.stringify(我的档案));
  玩家名 = 名;
  起名框.style.display = 'none'; 起名框.blur();
  声_过关();
  阶段 = '主页';
  发消息('[系统] 欢迎新玩家「' + 名 + '」！你的终身 ID：' + 我的档案.id + '（右上角👥随时查看）', '#ffd23e', true);
}
function 骰子名字() {
  起名框.value = 随机名字表[Math.floor(Math.random() * 随机名字表.length)];
  声_点击();
}
/* 好友搜索：输 ID 找人 */
搜友框.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') 执行搜索好友();
});
function 执行搜索好友() {
  const 码 = 搜友框.value.trim().toUpperCase();
  搜友框.value = ''; 搜友框.blur();
  if (码.length !== 5) { 搜索结果 = { 未命中: true, 提示: 'ID 要 5 位字母+数字' }; return; }
  const 员 = 测试队员.find(f => f.id === 码);
  if (员) {
    搜索结果 = { 命中: true, 员 };
    声_叮();
  } else {
    搜索结果 = { 未命中: true, 提示: '没找到 ' + 码 + '——确认朋友在线且没打错？' };
    声_锁错();
  }
}
function 添加好友(员) {
  if (好友列表.some(f => f.id === 员.id)) return;
  好友列表.push({ 名: 员名(员), id: 员.id, 色: 员.色 });
  存好友();
  搜索结果 = null;
  发消息('[好友] ' + 员名(员) + ' 已添加！', '#7dff8a', true);
  声_救起();
}
function 员名(员) { return 员.名 || 员; }
function 删除好友(id) {
  好友列表 = 好友列表.filter(f => f.id !== id);
  已邀好友们 = 已邀好友们.filter(f => f.id !== id);
  存好友();
}
function 邀请好友(友) {
  if (邀请等待) return;
  邀请等待 = { 友, 计时: 1.4 };
  声_点击();
}
function 邀请结算(友) {
  // 测试队员看心情：多半同意，偶尔在忙
  if (Math.random() < 0.85) {
    已邀好友们.push(友);
    邀请结果文 = 友.名 + ' 同意入队！（出发时随队）';
    邀请结果计时 = 3.5;
    发消息('[好友] ' + 友.名 + ' 同意了你的邀请！', '#7dff8a', true);
    声_救起();
  } else {
    邀请结果文 = 友.名 + '：' + ['在吃饭，等会再喊我', '这局在忙，下把一定', '让我妈再说一遍……'][Math.floor(Math.random() * 3)];
    邀请结果计时 = 3;
    声_锁错();
  }
}
/* 队伍编制：已邀好友优先上场，空位补默认队员（阿凯/小橙/豆豆） */
function 编制队伍() {
  const 名单 = [];
  for (const 友 of 已邀好友们) 名单.push({ 名: 友.名, 色: 友.色, 是好友: true });
  if (自动补齐) {
    for (const 花 of 队友花名册) {
      if (名单.length >= 3) break;
      if (!名单.some(m => m.名 === 花.名)) 名单.push({ 名: 花.名, 色: 花.色, 是好友: false });
    }
  }
  return 名单.slice(0, 3);
}

装载安全屋();   // 先装载一次让全局有数据
requestAnimationFrame(帧);
