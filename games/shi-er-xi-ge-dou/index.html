let 音响 = null;
function 确保音响() { if (!音响) 音响 = new AudioContext(); }
function 播放音(频率列表, 时长 = 0.15, 类型 = 'sine', 音量 = 0.2) {
  if (!音响) return;
  频率列表.forEach((频率, 序号) => {
    const 振荡器 = 音响.createOscillator(), 音量控制 = 音响.createGain();
    振荡器.type = 类型; 振荡器.frequency.value = 频率;
    const 开始于 = 音响.currentTime + 序号 * 0.07;
    振荡器.connect(音量控制); 音量控制.connect(音响.destination);

    else 飘字(点 + ' 点…今天运气不太好', p.x, p.y - 140, 'rgba(255,255,255,0.85)', 16);
  } else if (技号 === 4) {   // 影遁紫·瞬影姿态（大王钦定 v5）：10 秒完美格挡一切

    p.x = Math.max(30, Math.min(宽 - 30, p.x + 向 * 150));

/* ========== 🤖 对手脑子 ========== */
function AI思考(dt, 我 = 玩家2, 他 = 玩家1) {
  const 输 = 我.输入;
  Object.keys(输).forEach(k => 输[k] = false);
  if (阶段 !== '战斗中' || 我.定身 > 0 || 我.倒地 > 0) return;
  if (我.发呆 > 0) { 我.发呆 -= dt / 60; return; }
  if (Math.random() < 0.002) 我.发呆 = 0.25;
  const dx = 他.x - 我.x, 距 = Math.abs(dx);
  const 忙 = 我.攻击状态 || 我.硬直 > 0 || 我.蓄能中;
  if (忙) return;
  /* 对手出招时按几率格挡 */
  if (他.攻击状态 && 距 < 110 && Math.random() < 我.格挡率 * 0.3) { 输.格挡 = true; return; }
  /* 技能 */
  if (我.席 === '变色龙') {   // 第七席：变成对手的样子，偷学对手的技能（大王钦定）
    if (我.变色 && 我.变色.余 > 0) {
      我.变色.余 -= dt;
      if (我.变色.余 <= 0) { 我.变色 = null; 飘字('变色龙：变回来了。', 我.x, 我.y - 150, 'rgba(255,255,255,0.8)', 14); }
      else if (我.变色.技 !== 6 && 我.技能冷却 <= 0 && Math.random() < 0.02) 放技能(我, 他, 我.变色.技);   // 用偷来的技能打你！
    } else if (我.变色冷却 <= 0) {
      我.变色 = { 余: 30 * 60, 技: 当前皮肤 };
      特效('变身', 我.x, 我.y - 55);
      声_狂暴(); 飘字('变色龙：变！', 我.x, 我.y - 150, '#3ecf6a', 20);
      我.变色冷却 = 40 * 60;
      我.技能冷却 = 1.5;   // 秒（1.5 秒后开始用偷来的技能）
    } else 我.变色冷却 -= dt;
  }
  if (我.席 && 我.技能冷却 <= 0 && 我.席 !== '变色龙') {
    if (我.席 === '魔火') {   // 大王钦定 v6：魔火变聪明了，会跳起来放高球！
      if (我.跳射计时 > 0) {
        我.跳射计时 -= dt;
        if (我.跳射计时 <= 0) { 掷火球(我, 他, 我.y - 55); 我.技能冷却 = 12; }   // 空中出手=高球，只能蹲
      } else if (我.在地 && Math.random() < 0.5 && 距 > 150) {
        我.竖速 = -11; 我.在地 = false; 我.跳射计时 = 22;   // 起跳，蓄势跳射
      } else {
        放技能(我, 他, 7);   // 平球（跳/蹲都能躲）
      }
      return;
    }
    if (我.席 === '治愈者' && 我.HP < 席档案.治愈者.血 - 25) { 放技能(我, 他, 8); return; }
    if (我.席 === '时空破碎者' && 历史快照.length > 200 && 我.HP < 历史快照[0].p2.HP - 35) { 我.技能冷却 = 0; 放技能(我, 他, 10); return; }
    if (我.席 === '魅影' && !(我.分身 > 0)) { 放技能(我, 他, 9); return; }
    if (我.席 === '黑头子') { 小弟列表.push({ x: 我.x, 相位: '追', 计时: 3, 目标: 他 }); 我.技能冷却 = 10; 声_召唤(); 飘字('黑头子：上！小弟！', 我.x, 我.y - 150, '#ff4d6d', 16); return; }
    if (我.席 === '独眼龙' && 距 < 240) { 眼球列表.push({ x: Math.max(60, 他.x - 110), y: 130, 相位: '蓄', 计时: 2, 目标: 他 }); 眼球列表.push({ x: Math.min(宽 - 60, 他.x + 110), y: 130, 相位: '蓄', 计时: 2, 目标: 他 }); 我.技能冷却 = 12; 声_定身(); return; }
  }
  const 逼近键 = 他.x > 我.x ? '前' : '后';   // 绝对方向：对手在右边按"前"
  const 远离键 = 逼近键 === '前' ? '后' : '前';
  if (距 > 96) {
    if (Math.random() < 我.攻击欲) 输[逼近键] = true;
    if (他.攻击状态 && 距 < 150 && Math.random() < 我.格挡率) 输.格挡 = true;
  } else {
    const 抽 = Math.random();
    if (抽 < 0.3 && !他.蹲) 输.上踢 = true;
    else if (抽 < 0.62) 输.下踢 = true;
    else if (抽 < 0.85) 输.拳 = true;
    else 输[远离键] = true;
  }
}

/* ========== 🔄 主循环 ========== */
let 上一帧时间 = 0;
function 某帧过去了(时间戳) {
  const dt = Math.min((时间戳 - 上一帧时间) / 16.666, 3);
  上一帧时间 = 时间戳;
  更新(dt);
  绘制();

    if (Math.random() < 0.3) 火花(p.x + (Math.random() - 0.5) * 30, p.y - 20 - Math.random() * 50, '#ffd60a', 1);
  }
  /* 格挡 */
  const 想挡 = p.在地 && !p.攻击状态 && !p.冲刺 && !p.滑铲 && p.硬直 <= 0 && !p.蓄能中 && 输.格挡 && p.定身 <= 0;
  if (想挡 && !p.格挡中) { p.格挡中 = true; p.格挡计时 = 0; }
  else if (想挡) p.格挡计时 += dt;
  else p.格挡中 = false;
  /* 蹲 */
  p.蹲 = p.在地 && !p.攻击状态 && !p.冲刺 && !p.滑铲 && 输.蹲 && !p.蓄能中 && p.定身 <= 0;

  /* 出招 */
  if (p.定身 <= 0 && !p.格挡中 && !p.蓄能中 && !p.冲刺 && !p.滑铲 && p.硬直 <= 0 && !p.攻击状态 && p.攻击冷却 <= 0 && p.连技冷却 <= 0) {
    if (p.蹲 && 输.拳 && p.滑铲冷却 <= 0) 滑铲起(p);   // 大王钦定：蹲+K=滑铲
    else if (输.拳) 出招(p, '拳');
    else if (输.上踢) 出招(p, '上踢');
    else if (输.下踢) 出招(p, '下踢');
  }
  if (p.攻击冷却 > 0) p.攻击冷却 -= dt;

  /* 移动跳（前键=向右、后键=向左；朝对手方向走得快，背向是退步） */
  if (!p.攻击状态 && !p.冲刺 && p.硬直 <= 0 && !p.格挡中 && !p.蓄能中 && !p.蹲 && p.定身 <= 0) {
    const 移 = (输.前 ? 1 : 0) - (输.后 ? 1 : 0);
    if (移 !== 0) {
      const 朝前走 = 移 === p.朝向;
      p.x += 移 * (朝前走 ? 速 : 退速 * 疾风加成 * 狂暴加成) * dt;
    }
  }
  if (p.在地 && 输.跳 && p.硬直 <= 0 && !p.格挡中 && !p.蓄能中 && !p.冲刺 && p.定身 <= 0) { p.竖速 = -跳力; p.在地 = false; }
  p.竖速 += 重力 * dt;
  p.y += p.竖速 * dt;
  if (p.y >= 地面y) { p.y = 地面y; p.竖速 = 0; p.在地 = true; }
  p.x = Math.max(30, Math.min(宽 - 30, p.x));
  /* 俩人别叠一起 */
  const 缝 = 34;
  if (Math.abs(玩家1.x - 玩家2.x) < 缝 && 玩家1.在地 && 玩家2.在地) {
    const 中 = (玩家1.x + 玩家2.x) / 2;
    玩家1.x = 中 - 缝 / 2 * Math.sign(玩家1.x - 玩家2.x || 1) - 缝 / 2 * 0;
    玩家1.x = Math.max(30, 玩家1.x - (玩家1.x < 玩家2.x ? 0 : 缝 / 2));
    玩家2.x = Math.min(宽 - 30, 玩家2.x + (玩家2.x > 玩家1.x ? 0 : 缝 / 2));
    if (玩家1.x < 玩家2.x) { 玩家1.x = Math.max(30, 中 - 缝 / 2); 玩家2.x = Math.min(宽 - 30, 中 + 缝 / 2); }
    else { 玩家2.x = Math.max(30, 中 - 缝 / 2); 玩家1.x = Math.min(宽 - 30, 中 + 缝 / 2); }
  }
  /* 狂暴火花 */
  if (p.狂暴剩 > 0 && Math.random() < 0.4) 火花(p.x + (Math.random() - 0.5) * 24, p.y - 30 - Math.random() * 60, '#ff4d6d', 1);
}

function 转特效(dt) {
  for (let i = 粒子列表.length - 1; i >= 0; i--) {
    const 点 = 粒子列表[i];
    点.x += 点.横速 * dt; 点.y += 点.竖速 * dt; 点.竖速 += 0.22 * dt; 点.寿命 -= 0.03 * dt;
    if (点.寿命 <= 0) 粒子列表.splice(i, 1);
  }
  for (let i = 飘字列表.length - 1; i >= 0; i--) {
    const 字 = 飘字列表[i];
    字.y -= 0.8 * dt; 字.寿命 -= dt / 60 * 1.1;
    if (字.寿命 <= 0) 飘字列表.splice(i, 1);
  }
  if (抖动倒计时 > 0) 抖动倒计时 -= dt;
  if (爆闪 > 0) 爆闪 -= dt / 60;
}

/* ========== 🎨 绘制 ========== */
function 绘制() {
  笔.save();
  if (抖动倒计时 > 0) 笔.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
  /* 夜城擂台 */
  const 天 = 笔.createLinearGradient(0, 0, 0, 高);
  天.addColorStop(0, '#171034'); 天.addColorStop(0.5, '#3b2565'); 天.addColorStop(1, '#b0486a');
  笔.fillStyle = 天; 笔.fillRect(0, 0, 宽, 高);
  for (let i = 0; i < 30; i++) {
    笔.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(Date.now() / 700 + i));
    笔.fillStyle = '#fff';
    笔.fillRect((i * 97) % 宽, (i * 53) % 200, 2, 2);
  }
  笔.globalAlpha = 1;
  for (let i = -1; i < 宽 / 130 + 2; i++) {
    const 楼高 = 90 + ((i * 137) % 160 + 160) % 160;

    笔.fillStyle = 'rgba(255,217,122,0.5)';

      if ((i * 7 + r * 3 + c) % 4 < 2) 笔.fillRect(i * 130 + 14 + c * 34, 地面y - 楼高 - 12 + r * 26, 11, 13);
  }
  笔.fillStyle = '#33284f'; 笔.fillRect(0, 地面y, 宽, 高 - 地面y);
  笔.fillStyle = '#7ee8fa'; 笔.globalAlpha = 0.7; 笔.fillRect(0, 地面y, 宽, 3); 笔.globalAlpha = 1;
  笔.strokeStyle = 'rgba(126,232,250,0.5)'; 笔.lineWidth = 4;

  if (阶段 !== '菜单' && 阶段 !== '房间' && 阶段 !== '房码' && 阶段 !== '大厅' && 阶段 !== '模式选择' && 阶段 !== '剧情' && 阶段 !== '剧情卡' && 阶段 !== '皮肤') {
    /* 眼球 */
    眼球列表.forEach(眼 => {
      const 目 = 眼.目标 === 玩家2 ? 玩家2 : 玩家1;
      笔.save();
      笔.globalCompositeOperation = 'lighter';
      const 晕 = 笔.createRadialGradient(眼.x, 眼.y, 0, 眼.x, 眼.y, 26);
      晕.addColorStop(0, 'rgba(244,246,255,0.85)'); 晕.addColorStop(1, 'rgba(244,246,255,0)');
      笔.fillStyle = 晕; 笔.beginPath(); 笔.arc(眼.x, 眼.y, 26, 0, 6.29); 笔.fill();
      笔.restore();
      笔.fillStyle = '#f4f6ff'; 笔.beginPath(); 笔.arc(眼.x, 眼.y, 14, 0, 6.29); 笔.fill();
      const dx = 目.x - 眼.x, dy = 目.y - 50 - 眼.y, 距 = Math.hypot(dx, dy) || 1;
      笔.fillStyle = 眼.相位 === '蓄' ? '#4f8fef' : '#ff4d6d';
      笔.beginPath(); 笔.arc(眼.x + dx / 距 * 5, 眼.y + dy / 距 * 5, 6.5, 0, 6.29); 笔.fill();
      笔.fillStyle = '#1c1c26'; 笔.beginPath(); 笔.arc(眼.x + dx / 距 * 7, 眼.y + dy / 距 * 7, 2.8, 0, 6.29); 笔.fill();
      if (眼.相位 === '蓄') {
        笔.strokeStyle = '#7ee8fa'; 笔.lineWidth = 3;
        const 起 = Date.now() / 150;
        for (let k = 0; k < 4; k++) { 笔.beginPath(); 笔.arc(眼.x, 眼.y, 22, 起 + k * 1.57, 起 + k * 1.57 + 0.9); 笔.stroke(); }
        笔.globalAlpha = 眼.计时 / 2 * 0.9; 笔.beginPath(); 笔.arc(眼.x, 眼.y, 22, -Math.PI / 2, -Math.PI / 2 + (眼.计时 / 2) * 6.29); 笔.stroke(); 笔.globalAlpha = 1;
      } else {
        const 抖 = Math.sin(Date.now() / 30) * 2;
        笔.save();
        笔.globalCompositeOperation = 'lighter';
        笔.strokeStyle = 'rgba(126,232,250,0.35)'; 笔.lineWidth = 9;
        笔.beginPath(); 笔.moveTo(眼.x, 眼.y); 笔.lineTo(目.x + 抖, 目.y - 50); 笔.stroke();
        笔.strokeStyle = '#bff3ff'; 笔.lineWidth = 2.5;
        笔.beginPath(); 笔.moveTo(眼.x, 眼.y); 笔.lineTo(目.x + 抖, 目.y - 50); 笔.stroke();
        笔.restore();
      }
    });
    小弟列表.forEach(弟 => {
      const 涨 = 弟.相位 === '僵' ? 12 + (2 - 弟.计时) * 3 : 12;
      const 中心y = 地面y - 涨;
      笔.save();
      笔.globalCompositeOperation = 'lighter';
      const 危 = 弟.相位 === '僵' ? (Math.floor(Date.now() / 80) % 2 === 0 ? '#ff4d6d' : '#ff9f43') : 'rgba(255,107,129,0.3)';
      const 晕 = 笔.createRadialGradient(弟.x, 中心y, 0, 弟.x, 中心y, 涨 * 2.2);
      晕.addColorStop(0, 危); 晕.addColorStop(1, 'rgba(255,107,129,0)');
      笔.fillStyle = 晕; 笔.beginPath(); 笔.arc(弟.x, 中心y, 涨 * 2.2, 0, 6.29); 笔.fill();
      笔.restore();
      笔.fillStyle = 弟.相位 === '僵' && Math.floor(Date.now() / 80) % 2 === 0 ? '#ff4d6d' : '#1c1c26';
      笔.beginPath(); 笔.arc(弟.x, 中心y, 涨, 0, 6.29); 笔.fill();
      笔.fillStyle = '#fff';
      笔.beginPath(); 笔.arc(弟.x - 4, 中心y - 3, 2.6, 0, 6.29); 笔.arc(弟.x + 4, 中心y - 3, 2.6, 0, 6.29); 笔.fill();
      if (弟.相位 === '僵') { 笔.fillStyle = '#ffd60a'; 笔.font = 'bold 18px system-ui'; 笔.textAlign = 'center'; 笔.fillText('！', 弟.x, 中心y - 涨 - 8); }
    });

    /* 前冲能量波（画质大革命：渐变能量核 + 拖尾 + 电火花） */
    波列表.forEach(波 => {
      笔.save();
      笔.globalCompositeOperation = 'lighter';
      for (let k = 1; k <= 4; k++) {
        笔.globalAlpha = 0.4 - k * 0.08;
        笔.fillStyle = '#67e8f9';
        笔.beginPath(); 笔.arc(波.x - 波.方向 * k * 14, 波.y + Math.sin(波.寿命 + k) * 2, 11 - k * 1.6, 0, 6.29); 笔.fill();
      }
      笔.globalAlpha = 0.95;
      const 核 = 笔.createRadialGradient(波.x, 波.y, 0, 波.x, 波.y, 14);
      核.addColorStop(0, '#fff'); 核.addColorStop(0.45, '#a5f3fc'); 核.addColorStop(1, 'rgba(103,232,249,0.1)');
      笔.fillStyle = 核; 笔.beginPath(); 笔.arc(波.x, 波.y, 14, 0, 6.29); 笔.fill();
      笔.strokeStyle = '#fff'; 笔.lineWidth = 1.6;
      for (let k = 0; k < 3; k++) {
        const 角 = Date.now() / 90 + k * 2.1;
        笔.beginPath(); 笔.moveTo(波.x + Math.cos(角) * 13, 波.y + Math.sin(角) * 13);
        笔.lineTo(波.x + Math.cos(角 + 0.5) * 17, 波.y + Math.sin(角 + 0.5) * 17); 笔.stroke();
      }
      笔.restore();
    });

    /* 魔火球（第七席）：渐变火焰核 + 摆动火尾 */
    火球列表.forEach(球 => {
      笔.save();
      笔.globalCompositeOperation = 'lighter';
      const 核 = 笔.createRadialGradient(球.x, 球.y, 0, 球.x, 球.y, 16);
      核.addColorStop(0, '#fff'); 核.addColorStop(0.35, '#ffd60a'); 核.addColorStop(0.7, '#ff5722'); 核.addColorStop(1, 'rgba(255,87,34,0)');
      笔.fillStyle = 核; 笔.beginPath(); 笔.arc(球.x, 球.y, 16, 0, 6.29); 笔.fill();
      for (let k = 1; k <= 3; k++) {
        笔.globalAlpha = 0.5 - k * 0.13;
        笔.fillStyle = '#ff9f43';
        笔.beginPath(); 笔.arc(球.x - 球.方向 * k * 12, 球.y + Math.sin(球.寿命 + k * 2) * 3, 12 - k * 3, 0, 6.29); 笔.fill();
      }
      笔.restore();
    });
    /* 疾风闪现残影 */
    if (玩家2.闪现) {
      笔.globalAlpha = 0.5 + Math.sin(Date.now() / 60) * 0.2;
      笔.strokeStyle = '#67e8f9'; 笔.lineWidth = 4;
      笔.beginPath(); 笔.arc(玩家2.闪现.x, 地面y - 40, 30, 0, 6.29); 笔.stroke();
      笔.fillStyle = '#67e8f9'; 笔.beginPath(); 笔.arc(玩家2.闪现.x, 地面y - 66, 12, 0, 6.29); 笔.fill();
      笔.globalAlpha = 1;
    }
    /* 镜影分身（大王钦定 v6）：本体两边各一个淡色镜像，动作同步 */
    [[玩家1, 玩家1.分身], [玩家2, 玩家2.分身]].forEach(([p, 余]) => {
      if (余 > 0) {
        [-64, 64].forEach(偏 => {
          笔.save();
          笔.translate(偏, 0);
          笔.globalAlpha = 0.38 + Math.sin(Date.now() / 160) * 0.08;
          画拳手(p);
          笔.restore();
        });
      }
    });
    if (回放) {
      const 照 = 历史快照[Math.max(0, Math.min(历史快照.length - 1, Math.round(回放.序)))];
      if (照) {
        [[玩家1, 照.p1], [玩家2, 照.p2]].forEach(([p, s]) => {
          笔.save();
          笔.globalAlpha = 0.8;
          const 真x = p.x, 真y = p.y, 真朝 = p.朝向;
          p.x = s.x; p.y = s.y; p.朝向 = s.朝向;
          画拳手(p);
          p.x = 真x; p.y = 真y; p.朝向 = 真朝;
          笔.restore();
        });
        /* VHS 倒带感：扫描线 + 紫色噪点 */
        笔.fillStyle = 'rgba(179,136,255,0.12)';
        for (let ly = (Date.now() / 6) % 8; ly < 高; ly += 8) 笔.fillRect(0, ly, 宽, 3);
        笔.font = 'bold 30px system-ui'; 笔.textAlign = 'center';
        笔.fillStyle = '#b388ff';
        if (Math.floor(Date.now() / 120) % 2 === 0) 笔.fillText('◀◀ 时空回溯中', 宽 / 2, 80);
      }
    } else {
      画拳手(玩家1);
      画拳手(玩家2);
      绘制特效();
    }
    笔.save();
    笔.globalCompositeOperation = 'lighter';
    粒子列表.forEach(点 => {
      笔.globalAlpha = Math.max(0, 点.寿命); 笔.fillStyle = 点.颜色;
      笔.beginPath(); 笔.arc(点.x, 点.y, 点.大小 * 点.寿命, 0, 6.29); 笔.fill();
      笔.globalAlpha = 1;
    });
    笔.restore();
    笔.textAlign = 'center'; 笔.textBaseline = 'middle';
    飘字列表.forEach(字 => {
      笔.globalAlpha = Math.max(0, 字.寿命);
      笔.font = `bold ${字.大}px system-ui, "PingFang SC", sans-serif`;
      笔.lineWidth = 4; 笔.strokeStyle = 'rgba(20,10,30,0.7)'; 笔.strokeText(字.文字, 字.x, 字.y);
      笔.fillStyle = 字.色; 笔.fillText(字.文字, 字.x, 字.y);
      笔.globalAlpha = 1;
    });
    画血条能量();
  }

  /* 手机按钮 */
  if (阶段 === '战斗中') {
    笔.globalAlpha = 0.26; 笔.fillStyle = '#ffffff';
    按钮布局.forEach(b => { 笔.beginPath(); 笔.arc(b.x, b.y, 22, 0, 6.29); 笔.fill(); });
    笔.globalAlpha = 0.85; 笔.fillStyle = '#2a1d47'; 笔.font = 'bold 12px system-ui';
    按钮布局.forEach(b => 笔.fillText(b.图, b.x, b.y));
    笔.globalAlpha = 1;
  }

  if (爆闪 > 0) { 笔.globalAlpha = Math.min(0.6, 爆闪 / 0.2 * 0.6); 笔.fillStyle = '#fff'; 笔.fillRect(0, 0, 宽, 高); 笔.globalAlpha = 1; }
  if (阶段 === '介绍') 画介绍();
  if (阶段 === '回合结算') {
    笔.fillStyle = 'rgba(30,18,50,0.66)'; 笔.fillRect(0, 240, 宽, 90);
    笔.font = 'bold 24px system-ui, "PingFang SC", sans-serif'; 笔.textAlign = 'center';
    笔.fillStyle = '#fff'; 笔.fillText(结算文本, 宽 / 2, 285);
  }
  if (阶段 === '骰子') 画骰子();
  if (阶段 === '菜单') 画菜单();
  if (阶段 === '房间') 画房间菜单();
  if (阶段 === '房码') 画房码();
  if (阶段 === '大厅') 画大厅();
  if (阶段 === '模式选择') 画模式选择();
  if (阶段 === '剧情') 画剧情();
  if (阶段 === '剧情卡') 画剧情卡();
  if (阶段 === '皮肤') 画皮肤();
  if (阶段 === '终局') 画终局();
  if (阶段 === '剧情胜利') 画剧情胜利();
  if (阶段 === '剧终') 画剧终();
  if (阶段 === '失败') 画失败();
  笔.restore();
}

/* ★ 绘制特效：发光叠加（lighter）让能量真正"发亮"，每个特效 22 帧内收场——短促有力 */
function 绘制特效() {
  笔.save();
  笔.globalCompositeOperation = 'lighter';
  特效列表.forEach(效 => {
    const 进 = 效.帧 / 22;
    if (效.类型 === '喷涌') {
      for (let k = 0; k < 3; k++) {
        const 环进 = Math.max(0, Math.min(1, 进 * 1.4 - k * 0.18));
        if (环进 <= 0 || 环进 >= 1) continue;
        笔.globalAlpha = (1 - 环进) * 0.8;
        笔.lineWidth = 10 * (1 - 环进) + 2;
        笔.strokeStyle = k === 0 ? '#fff' : k === 1 ? '#ffd60a' : '#ff4d6d';
        笔.beginPath(); 笔.arc(效.x, 效.y, 30 + 环进 * 150, 0, 6.29); 笔.stroke();
      }
      笔.globalAlpha = (1 - 进) * 0.9;
      for (let i = 0; i < 10; i++) {
        const 角 = (i / 10) * Math.PI * 2 + 0.3;
        const 长 = 60 + Math.sin(进 * Math.PI) * 80;
        笔.strokeStyle = i % 2 ? '#ffd60a' : '#ff6b81'; 笔.lineWidth = 5;
        笔.beginPath(); 笔.moveTo(效.x + Math.cos(角) * 26, 效.y + Math.sin(角) * 26);
        笔.lineTo(效.x + Math.cos(角) * (26 + 长), 效.y + Math.sin(角) * (26 + 长)); 笔.stroke();
      }
      if (进 < 0.5) {
        笔.globalAlpha = (1 - 进 * 2) * 0.95;
        const 核 = 笔.createRadialGradient(效.x, 效.y, 0, 效.x, 效.y, 60);
        核.addColorStop(0, '#fff'); 核.addColorStop(0.5, '#ffd60a'); 核.addColorStop(1, 'rgba(255,107,129,0)');
        笔.fillStyle = 核; 笔.beginPath(); 笔.arc(效.x, 效.y, 60, 0, 6.29); 笔.fill();
      }
    } else if (效.类型 === '斩杀') {
      const 弧 = 效.大 ? 130 : 90;
      笔.globalAlpha = (1 - 进) * 0.95;
      笔.lineWidth = 效.大 ? 16 : 10;
      笔.strokeStyle = '#ff9f43';
      笔.beginPath(); 笔.arc(效.x, 效.y, 弧 * (0.7 + 进 * 0.5), -1.1, 1.1); 笔.stroke();
      笔.lineWidth = 效.大 ? 7 : 4;
      笔.strokeStyle = '#fff';
      笔.beginPath(); 笔.arc(效.x, 效.y, 弧 * (0.7 + 进 * 0.5) - 6, -0.9, 0.9); 笔.stroke();
      if (效.大 && 进 < 0.4) { 笔.globalAlpha = (1 - 进 * 2.5) * 0.5; 笔.fillStyle = '#ff4d6d'; 笔.fillRect(0, 0, 宽, 高); }
    } else if (效.类型 === '冲撞') {
      笔.globalAlpha = (1 - 进) * 0.9;
      const 核 = 笔.createRadialGradient(效.x, 效.y, 0, 效.x, 效.y, 46);
      核.addColorStop(0, '#fff'); 核.addColorStop(0.4, '#67e8f9'); 核.addColorStop(1, 'rgba(103,232,249,0)');
      笔.fillStyle = 核; 笔.beginPath(); 笔.arc(效.x, 效.y, 46 * (0.6 + 进 * 0.6), 0, 6.29); 笔.fill();
      for (let i = 0; i < 6; i++) {
        const 角 = -0.9 + i * 0.36;
        笔.strokeStyle = '#fff'; 笔.lineWidth = 3;
        笔.beginPath(); 笔.moveTo(效.x, 效.y);
        笔.lineTo(效.x + Math.cos(角) * (30 + 进 * 40), 效.y + Math.sin(角) * (30 + 进 * 40)); 笔.stroke();
      }
    } else if (效.类型 === '爆炸') {
      笔.globalAlpha = (1 - 进) * 0.85;
      笔.lineWidth = 8 * (1 - 进) + 2; 笔.strokeStyle = '#ffd60a';
      笔.beginPath(); 笔.arc(效.x, 效.y, 20 + 进 * 100, 0, 6.29); 笔.stroke();
      if (进 < 0.6) {
        const 核 = 笔.createRadialGradient(效.x, 效.y, 0, 效.x, 效.y, 55);
        核.addColorStop(0, '#fff'); 核.addColorStop(0.4, '#ff9f43'); 核.addColorStop(1, 'rgba(255,107,129,0)');
        笔.fillStyle = 核; 笔.beginPath(); 笔.arc(效.x, 效.y, 55, 0, 6.29); 笔.fill();
      }
    } else if (效.类型 === '换位') {
      笔.globalAlpha = (1 - 进) * 0.8;
      笔.strokeStyle = '#b98bff'; 笔.lineWidth = 6;
      笔.beginPath(); 笔.moveTo(效.x, 效.y); 笔.lineTo(效.x2, 效.y2); 笔.stroke();
      笔.strokeStyle = '#fff'; 笔.lineWidth = 2;
      笔.beginPath(); 笔.moveTo(效.x, 效.y); 笔.lineTo(效.x2, 效.y2); 笔.stroke();
      笔.fillStyle = '#d8c2ff';
      笔.beginPath(); 笔.arc(效.x2, 效.y2, 14 + 进 * 10, 0, 6.29); 笔.fill();
    } else if (效.类型 === '治愈') {
      笔.globalAlpha = (1 - 进) * 0.85;
      for (let k = 0; k < 3; k++) {
        笔.strokeStyle = `rgba(123,237,159,${1 - k * 0.25})`;
        笔.lineWidth = 4 - k;
        笔.beginPath(); 笔.arc(效.x, 效.y - 进 * 60 + k * 12, 18 + k * 10 + 进 * 20, 0, 6.29); 笔.stroke();
      }
    } else if (效.类型 === '姿态') {
      笔.globalAlpha = (1 - 进) * 0.9;
      for (let k = 0; k < 2; k++) {
        笔.strokeStyle = k ? '#fff' : '#ffd60a';
        笔.lineWidth = 5 - k * 2;
        笔.beginPath(); 笔.arc(效.x, 效.y, 20 + k * 12 + 进 * 50, 0, 6.29); 笔.stroke();
      }
    } else if (效.类型 === '变身') {
      笔.globalAlpha = (1 - 进) * 0.85;
      for (let k = 0; k < 3; k++) {
        笔.strokeStyle = `hsl(${(Date.now() / 5 + k * 110) % 360}, 85%, 62%)`;
        笔.lineWidth = 4;
        const 半 = 18 + k * 10 + 进 * 45;
        笔.beginPath(); 笔.arc(效.x, 效.y, 半, 进 * 5 + k, 进 * 5 + k + 4.4); 笔.stroke();
      }
    }
  });
  笔.globalAlpha = 1;
  笔.restore();
}

/* --- 拳手造型（按状态摆姿势） --- */
function 画拳手(p) {
  const x = p.x, y = p.y, 向 = p.朝向;
  笔.save();
  if (p.无敌帧 > 0 && Math.floor(p.无敌帧 / 4) % 2 === 0) 笔.globalAlpha = 0.4;
  笔.lineCap = 'round'; 笔.lineWidth = 6; 笔.strokeStyle = '#f1f1f6';
  const 矮 = p.蹲 || p.蓄能中 ? 26 : 0;
  const 身顶 = y - 54 + 矮, 头y = y - 66 + 矮;
  /* 腿 */
  if (!p.在地) {
    笔.beginPath(); 笔.moveTo(x, y - 30); 笔.lineTo(x - 10 * 向, y - 16); 笔.lineTo(x - 2 * 向, y - 6); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x, y - 30); 笔.lineTo(x + 10 * 向, y - 20); 笔.stroke();
  } else if (p.攻击状态 && p.攻击状态.名 === '下踢') {
    笔.beginPath(); 笔.moveTo(x, y - 30); 笔.lineTo(x + 54 * 向, y - 10); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x, y - 30); 笔.lineTo(x - 8 * 向, y); 笔.stroke();
  } else if (p.攻击状态 && p.攻击状态.名 === '上踢') {
    笔.beginPath(); 笔.moveTo(x, y - 30); 笔.lineTo(x + 34 * 向, y - 52); 笔.lineTo(x + 58 * 向, y - 74); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x, y - 30); 笔.lineTo(x - 8 * 向, y); 笔.stroke();
  } else if (矮) {
    笔.beginPath(); 笔.moveTo(x, y - 24); 笔.lineTo(x + 14 * 向, y); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x, y - 24); 笔.lineTo(x - 12 * 向, y); 笔.stroke();
  } else {
    笔.beginPath(); 笔.moveTo(x, y - 30); 笔.lineTo(x + 7 * 向, y); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x, y - 30); 笔.lineTo(x - 7 * 向, y); 笔.stroke();
  }
  /* 身体 */
  笔.beginPath(); 笔.moveTo(x, y - 30 + 矮 * 0.4); 笔.lineTo(x, 身顶); 笔.stroke();
  /* 手臂 */
  if (p.攻击状态 && p.攻击状态.名 === '拳') {
    笔.beginPath(); 笔.moveTo(x, 身顶 + 4); 笔.lineTo(x + 46 * 向, 头y + 6); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x, 身顶 + 4); 笔.lineTo(x - 14 * 向, 身顶 + 14); 笔.stroke();
  } else if (p.格挡中) {
    笔.beginPath(); 笔.moveTo(x, 身顶 + 4); 笔.lineTo(x + 12 * 向, 头y + 14); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x, 身顶 + 4); 笔.lineTo(x + 16 * 向, 身顶 + 12); 笔.stroke();
  } else if (p.蓄能中) {
    笔.beginPath(); 笔.moveTo(x, 身顶 + 4); 笔.lineTo(x + 20 * 向, y - 20 + 矮); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x, 身顶 + 4); 笔.lineTo(x - 20 * 向, y - 20 + 矮); 笔.stroke();
  } else {
    笔.beginPath(); 笔.moveTo(x, 身顶 + 4); 笔.lineTo(x + 20 * 向, 身顶 + 16); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x, 身顶 + 4); 笔.lineTo(x - 12 * 向, 身顶 + 14); 笔.stroke();
  }
  /* 倒地：躺平 + 晕星星（大王钦定 v7） */
  if (p.倒地 > 0) {
    笔.lineCap = 'round'; 笔.lineWidth = 6; 笔.strokeStyle = '#f1f1f6';
    笔.beginPath(); 笔.moveTo(x - 26 * 向, y - 6); 笔.lineTo(x + 20 * 向, y - 10); 笔.stroke();   // 躺倒的身体
    笔.fillStyle = p === 玩家1 ? ((皮肤列表[当前皮肤] || 皮肤列表[0]).色) : p.头色;
    笔.beginPath(); 笔.arc(x + 30 * 向, y - 12, 11, 0, 6.29); 笔.fill();
    笔.fillStyle = '#ffd60a'; 笔.font = '14px serif'; 笔.textAlign = 'center';
    for (let i = 0; i < 3; i++) {
      const 角 = Date.now() / 220 + i * 2.1;
      笔.fillText('✦', x + 30 * 向 + Math.cos(角) * 20, y - 34 + Math.sin(角) * 5);
    }
    笔.fillStyle = '#ff9f43'; 笔.font = 'bold 13px system-ui';
    笔.fillText(Math.ceil(p.倒地) + 's', x, y - 48);
    笔.restore();
    return;
  }
  /* 滑铲：贴地前冲（大王钦定 v7） */
  if (p.滑铲) {
    笔.lineCap = 'round'; 笔.lineWidth = 6; 笔.strokeStyle = '#f1f1f6';
    笔.beginPath(); 笔.moveTo(x - 24 * 向, y - 8); 笔.lineTo(x + 18 * 向, y - 16); 笔.stroke();
    笔.beginPath(); 笔.moveTo(x - 20 * 向, y - 8); 笔.lineTo(x + 30 * 向, y - 6); 笔.stroke();   // 前伸的腿
    笔.fillStyle = p === 玩家1 ? ((皮肤列表[当前皮肤] || 皮肤列表[0]).色) : p.头色;
    笔.beginPath(); 笔.arc(x + 24 * 向, y - 22, 11, 0, 6.29); 笔.fill();
    笔.strokeStyle = '#cfcfe6'; 笔.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      笔.beginPath(); 笔.moveTo(x - 30 * 向 - i * 10, y - 14 - i * 8); 笔.lineTo(x - 44 * 向 - i * 10, y - 14 - i * 8); 笔.stroke();   // 风线
    }
    笔.restore();
    return;
  }
  /* 头（幻彩变=彩虹流转；变身中=对手的模样；变色龙变了=你的模样） */
  let 头色, 头纹 = null;
  if (p === 玩家1) {
    if (玩家1.变身 && 玩家1.变身.余 > 0) 头色 = 玩家2.头色;
    else if (当前皮肤 === 6) { 头色 = `hsl(${(Date.now() / 15) % 360}, 82%, 60%)`; 头纹 = '纹'; }
    else { const 皮 = 皮肤列表[当前皮肤] || 皮肤列表[0]; 头色 = 皮.色; 头纹 = 皮.纹; }
  } else if (p.席 === '变色龙' && p.变色 && p.变色.余 > 0) {
    const 皮 = 皮肤列表[当前皮肤] || 皮肤列表[0];
    头色 = 当前皮肤 === 6 ? `hsl(${(Date.now() / 15 + 180) % 360}, 82%, 60%)` : 皮.色;
    头纹 = 皮.纹;
  } else 头色 = p.头色;
  笔.fillStyle = 头色;
  笔.beginPath(); 笔.arc(x, 头y, 12, 0, 6.29); 笔.fill();
  if (头纹) 画头纹(头纹, x, 头y);
  if (p === 玩家2 && p.席 && !(p.席 === '变色龙' && p.变色 && p.变色.余 > 0)) {
    笔.strokeStyle = '#fff'; 笔.lineWidth = 2;
    if (p.席 === '黑头子') {
      笔.fillStyle = '#fff';
      笔.beginPath(); 笔.arc(x - 4, 头y - 2, 2.4, 0, 6.29); 笔.arc(x + 4, 头y - 2, 2.4, 0, 6.29); 笔.fill();
    } else if (p.席 === '独眼龙') {
      笔.fillStyle = '#fff'; 笔.beginPath(); 笔.arc(x, 头y, 5.5, 0, 6.29); 笔.fill();
      笔.fillStyle = '#1c1c26'; 笔.beginPath(); 笔.arc(x + 向 * 2, 头y, 2.4, 0, 6.29); 笔.fill();
    } else if (p.席 === '气运之主') {
      笔.fillStyle = 'rgba(28,28,38,0.85)';
      [[-4, -4], [4, -4], [0, 0], [-4, 4], [4, 4]].forEach(([dx, dy]) => { 笔.beginPath(); 笔.arc(x + dx, 头y + dy, 1.7, 0, 6.29); 笔.fill(); });
    } else if (p.席 === '瞬影') {
      笔.beginPath(); 笔.moveTo(x - 6, 头y - 3); 笔.lineTo(x - 1, 头y); 笔.stroke();
      笔.beginPath(); 笔.moveTo(x + 6, 头y - 3); 笔.lineTo(x + 1, 头y); 笔.stroke();
    } else if (p.席 === '疾风') {
      for (let i = 0; i < 3; i++) { 笔.beginPath(); 笔.moveTo(x + 2 + i * 3, 头y - 6 + i * 3); 笔.lineTo(x + 9 + i * 3, 头y - 8 + i * 3); 笔.stroke(); }
    } else if (p.席 === '时空破碎者') {
      笔.strokeStyle = '#fff'; 笔.lineWidth = 1.8;
      笔.beginPath(); 笔.arc(x, 头y, 6, 0, 6.29); 笔.stroke();
      笔.beginPath(); 笔.moveTo(x, 头y); 笔.lineTo(x, 头y - 4); 笔.moveTo(x, 头y); 笔.lineTo(x + 3, 头y + 1); 笔.stroke();   // 小时钟
    } else if (p.席 === '治愈者') {
      笔.strokeStyle = '#eafff0'; 笔.lineWidth = 2.4;
      笔.beginPath(); 笔.moveTo(x - 5, 头y); 笔.lineTo(x + 5, 头y); 笔.moveTo(x, 头y - 5); 笔.lineTo(x, 头y + 5); 笔.stroke();   // 治愈十字
    } else if (p.席 === '魅影') {
      笔.strokeStyle = '#fff'; 笔.lineWidth = 1.8;
      笔.beginPath(); 笔.arc(x - 4, 头y - 2, 3, 0, 6.29); 笔.stroke();
      笔.beginPath(); 笔.moveTo(x + 2, 头y - 2); 笔.lineTo(x + 6, 头y - 2); 笔.stroke();   // 一圆眼一横眼
    } else if (p.席 === '魔火') {
      笔.strokeStyle = '#ffd60a'; 笔.lineWidth = 2;
      笔.beginPath(); 笔.moveTo(x - 5, 头y + 4); 笔.lineTo(x - 1, 头y - 5); 笔.lineTo(x + 3, 头y + 4); 笔.stroke();   // 小火苗脸
      笔.beginPath(); 笔.moveTo(x + 2, 头y + 6); 笔.lineTo(x + 5, 头y - 2); 笔.lineTo(x + 8, 头y + 6); 笔.stroke();
    } else if (p.席 === '变色龙') {
      笔.strokeStyle = '#eafff0'; 笔.lineWidth = 1.8;
      笔.beginPath(); 笔.arc(x, 头y - 2, 4.5, 0.5, 5.2); 笔.stroke();   // 卷卷的变色龙眼
    }
  }
  /* 状态圈 */
  if (p.格挡中 && p.格挡计时 <= 完美窗口帧) { 笔.strokeStyle = '#ffd60a'; 笔.lineWidth = 2; 笔.beginPath(); 笔.arc(x, y - 40, 30, 0, 6.29); 笔.stroke(); }
  if (p.盾) { 笔.strokeStyle = '#ffd60a'; 笔.lineWidth = 3; 笔.globalAlpha = 0.6 + Math.sin(Date.now() / 120) * 0.25; 笔.beginPath(); 笔.arc(x, y - 40, 34, 0, 6.29); 笔.stroke(); 笔.globalAlpha = 1; }
  if (p.完美姿态 > 0) {   // 瞬影姿态：双层金环流转
    笔.save();
    笔.globalCompositeOperation = 'lighter';
    笔.globalAlpha = 0.55 + Math.sin(Date.now() / 80) * 0.25;
    笔.strokeStyle = '#ffd60a'; 笔.lineWidth = 3;
    笔.beginPath(); 笔.arc(x, y - 40, 36, 0, 6.29); 笔.stroke();
    笔.lineWidth = 1.5;
    笔.beginPath(); 笔.arc(x, y - 40, 42 + Math.sin(Date.now() / 50) * 4, 0, 6.29); 笔.stroke();
    笔.restore();
  }
  if (p.狂暴剩 > 0) {   // 火焰舌狂暴光环
    笔.save();
    笔.globalCompositeOperation = 'lighter';
    笔.globalAlpha = 0.75;
    for (let i = 0; i < 5; i++) {
      const 摆 = Math.sin(Date.now() / 70 + i * 1.9) * 6;
      const 底x = x - 18 + i * 9;
      笔.fillStyle = i % 2 ? 'rgba(255,75,109,0.8)' : 'rgba(255,159,67,0.8)';
      笔.beginPath();
      笔.moveTo(底x - 4, y - 4);
      笔.quadraticCurveTo(底x + 摆, y - 40 - Math.abs(Math.sin(Date.now() / 90 + i)) * 34, 底x + 摆 * 0.4, y - 62 - Math.abs(Math.sin(Date.now() / 60 + i)) * 20);
      笔.quadraticCurveTo(底x + 6, y - 36, 底x + 6, y - 4);
      笔.closePath(); 笔.fill();
    }
    笔.restore();
  }
  if (p.定身 > 0) {
    笔.fillStyle = '#7ee8fa'; 笔.font = '14px serif'; 笔.textAlign = 'center';
    for (let i = 0; i < 3; i++) 笔.fillText('✦', x + Math.cos(Date.now() / 200 + i * 2.1) * 20, 头y - 16 + Math.sin(Date.now() / 200 + i * 2.1) * 5);
  }
  笔.restore();
}
function 画头纹(纹, x, y) {
  笔.save();
  笔.beginPath(); 笔.arc(x, y, 12, 0, 6.29); 笔.clip();
  if (纹 === '疤') { 笔.strokeStyle = '#fff'; 笔.lineWidth = 2; 笔.beginPath(); 笔.moveTo(x - 6, y - 5); 笔.lineTo(x + 2, y + 3); 笔.stroke(); }
  else if (纹 === '眼') { 笔.fillStyle = '#fff'; 笔.beginPath(); 笔.arc(x, y, 6, 0, 6.29); 笔.fill(); 笔.fillStyle = '#1c1c26'; 笔.beginPath(); 笔.arc(x + 2, y, 2.6, 0, 6.29); 笔.fill(); }
  else if (纹 === '骰') {
    笔.fillStyle = 'rgba(28,28,38,0.85)';
    [[-4, -4], [4, -4], [0, 0], [-4, 4], [4, 4]].forEach(([dx, dy]) => { 笔.beginPath(); 笔.arc(x + dx, y + dy, 1.7, 0, 6.29); 笔.fill(); });
  } else if (纹 === '星') {
    笔.fillStyle = '#fff'; 笔.beginPath();
    for (let i = 0; i < 5; i++) {
      const 角 = -Math.PI / 2 + i * (Math.PI * 2 / 5);
      笔.lineTo(x + Math.cos(角) * 6, y + Math.sin(角) * 6);
      const 内 = 角 + Math.PI / 5;
      笔.lineTo(x + Math.cos(内) * 2.5, y + Math.sin(内) * 2.5);
    }
    笔.fill();
  } else if (纹 === '纹') { 笔.fillStyle = 'rgba(255,255,255,0.4)'; 笔.fillRect(x - 12, y - 4, 24, 4); }
  else if (纹 === '冰') { 笔.fillStyle = 'rgba(255,255,255,0.85)'; 笔.beginPath(); 笔.arc(x - 4, y - 4, 1.5, 0, 6.29); 笔.arc(x + 4, y + 3, 1.5, 0, 6.29); 笔.arc(x, y + 6, 1.5, 0, 6.29); 笔.fill(); }
  笔.restore();
  if (纹 === '冠') {
    笔.fillStyle = '#ffd60a';
    笔.beginPath(); 笔.moveTo(x - 8, y - 11); 笔.lineTo(x - 8, y - 18); 笔.lineTo(x - 3, y - 13); 笔.lineTo(x, y - 19); 笔.lineTo(x + 3, y - 13); 笔.lineTo(x + 8, y - 18); 笔.lineTo(x + 8, y - 11); 笔.closePath(); 笔.fill();
  }
}

/* --- HUD：血条 + 能量槽 + 回合点 --- */
function 画血条能量() {
  /* 血条 */
  [[玩家1, 14, '#ff9f43', 1], [玩家2, 宽 - 174, 玩家2.席 ? 玩家2.头色 : '#5fa8ff', -1]].forEach(([p, x0, 色, 方]) => {
    笔.fillStyle = 'rgba(20,10,30,0.7)'; 笔.fillRect(x0, 18, 160, 18);
    笔.fillStyle = '#3d3358'; 笔.fillRect(x0 + 2, 20, 156, 14);
    const 满血量 = p === 玩家2 && p.席 === '气运之主' ? 气运阶段血[p.阶段] : (p === 玩家2 && p.席 ? 席档案[p.席].血 : 满血);
    const 长 = 156 * Math.max(0, Math.min(1, p.HP / 满血量));
    笔.fillStyle = 色;
    if (方 === 1) 笔.fillRect(x0 + 2, 20, 长, 14);
    else 笔.fillRect(x0 + 2 + 156 - 长, 20, 长, 14);
    笔.strokeStyle = 'rgba(255,255,255,0.35)'; 笔.lineWidth = 1.5; 笔.strokeRect(x0 + 2, 20, 156, 14);
  });
  /* 名字 + 回合点 */
  笔.font = 'bold 13px system-ui, "PingFang SC", sans-serif'; 笔.textBaseline = 'top';
  笔.textAlign = 'left'; 笔.fillStyle = '#ff9f43';
  笔.fillText('你 · ' + (皮肤列表[当前皮肤] || 皮肤列表[0]).名, 14, 40);
  笔.textAlign = 'right'; 笔.fillStyle = '#e8e8f0';
  笔.fillText(玩家2.名号 || '蓝头', 宽 - 14, 40);
  笔.textAlign = 'center'; 笔.font = '16px serif';
  笔.fillText('🥊', 宽 / 2, 20);
  笔.font = 'bold 15px system-ui'; 笔.fillStyle = '#ffd60a';
  笔.fillText('●'.repeat(玩家1.回合胜) + '○'.repeat(Math.max(0, 先胜回合 - 玩家1.回合胜)) + '  ' + '●'.repeat(玩家2.回合胜) + '○'.repeat(Math.max(0, 先胜回合 - 玩家2.回合胜)), 宽 / 2, 42);

    笔.strokeRect(40, y, 400, 48);
    笔.fillStyle = 席档案[章.boss].头; 笔.beginPath(); 笔.arc(68, y + 24, 13, 0, 6.29); 笔.fill();
    if (!开) { 笔.fillStyle = 'rgba(40,30,60,0.7)'; 笔.beginPath(); 笔.arc(68, y + 24, 13, 0, 6.29); 笔.fill(); 笔.font = '13px serif'; 笔.fillStyle = '#fff'; 笔.fillText('🔒', 68, y + 24); }
    笔.textAlign = 'left';
    笔.font = 'bold 13px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = 开 ? '#fff' : 'rgba(255,255,255,0.45)';
    笔.fillText((章.boss === '气运之主' ? '👑 ' : '') + 章.周 + ' · ' + 席档案[章.boss].名, 96, y + 17);
    笔.font = '11px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#ffb35c';
    笔.fillText(过 ? '✔ 已讨伐' : (开 ? '可挑战' : '先打赢前面的席'), 96, y + 36);
    笔.textAlign = 'center';
  });
  笔.font = '11px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = 'rgba(255,255,255,0.6)';
  笔.fillText('点卡片开剧情 · Esc 回菜单', 宽 / 2, 634);
}

function 画剧情卡() {
  笔.fillStyle = 'rgba(24,14,42,0.92)'; 笔.fillRect(0, 0, 宽, 高);
  const 章 = 剧情章节[战场.章 - 1];
  笔.textAlign = 'center'; 笔.textBaseline = 'middle';
  笔.font = 'bold 26px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#ffd60a';
  笔.fillText(章.周 + ' · ' + 席档案[章.boss].名, 宽 / 2, 70);
  笔.fillStyle = 席档案[章.boss].头; 笔.beginPath(); 笔.arc(宽 / 2, 150, 40, 0, 6.29); 笔.fill();
  笔.font = '17px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#e8e8f0';
  章.词.forEach((行, i) => 笔.fillText(行, 宽 / 2, 230 + i * 30));
  笔.fillStyle = '#5a4a8a'; 笔.fillRect(150, 520, 180, 50);
  笔.strokeStyle = '#7ee8fa'; 笔.lineWidth = 2; 笔.strokeRect(150, 520, 180, 50);
  笔.font = 'bold 20px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#fff';
  笔.fillText('⚔ 开战！（空格）', 宽 / 2, 545);
}

function 画皮肤() {
  笔.fillStyle = 'rgba(28,16,48,0.85)'; 笔.fillRect(0, 0, 宽, 高);
  笔.textAlign = 'center'; 笔.textBaseline = 'middle';
  笔.font = 'bold 28px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#ffd60a';
  笔.fillText('🎨 皮肤技能 ' + 已解锁皮肤.length + '/' + 皮肤列表.length, 宽 / 2, 60);
  笔.font = '14px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#e8e8f0';
  笔.fillText('穿 Boss 的皮学他的招 · 按 C 放 · 点一下换装', 宽 / 2, 92);
  皮肤列表.forEach((皮, 号) => {
    const 列 = 号 % 7, 行 = Math.floor(号 / 7);
    const x = 48 + 列 * 56 + 28, y = 150 + 行 * 56 + 24;
    const 有 = 已解锁皮肤.includes(号), 穿 = 当前皮肤 === 号;
    笔.fillStyle = '#3a3350'; 笔.fillRect(x - 26, y - 26, 52, 52);
    if (有) {
      笔.fillStyle = 皮.色; 笔.beginPath(); 笔.arc(x, y, 14, 0, 6.29); 笔.fill();
      画头纹(皮.纹, x, y);
    } else { 笔.font = '20px serif'; 笔.fillStyle = 'rgba(255,255,255,0.5)'; 笔.fillText('🔒', x, y); }
    if (穿) { 笔.strokeStyle = '#ffd60a'; 笔.lineWidth = 3; 笔.strokeRect(x - 26, y - 26, 52, 52); }
  });
  const 皮 = 皮肤列表[当前皮肤];
  笔.font = 'bold 17px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#7bed9f';
  笔.fillText('正在穿：' + 皮.名 + (皮肤技能[当前皮肤] ? ' · 技【' + 皮肤技能[当前皮肤].名 + '】' : ''), 宽 / 2, 352);
  笔.font = '13px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = 'rgba(255,255,255,0.6)';
  笔.fillText('Esc 回菜单', 宽 / 2, 378);
}

function 画终局() {
  笔.fillStyle = 'rgba(28,16,48,0.85)'; 笔.fillRect(0, 0, 宽, 高);
  笔.textAlign = 'center'; 笔.textBaseline = 'middle';
  笔.font = '56px serif'; 笔.fillText('🏆', 宽 / 2, 150);
  笔.font = 'bold 34px system-ui, "PingFang SC", sans-serif';
  笔.fillStyle = 玩家1.回合胜 > 玩家2.回合胜 ? '#ff9f43' : '#5fa8ff';
  if (战场 && 战场.类型 === '房间') {
    笔.fillStyle = 战团.冠军色 || '#ffd60a';
    笔.fillText(战团.冠军名 || '比赛结束', 宽 / 2, 235);
  } else 笔.fillText(玩家1.回合胜 > 玩家2.回合胜 ? '你赢了！' : (模式 === '双人' ? '蓝头获胜！' : '机器人赢了…'), 宽 / 2, 235);
  笔.font = 'bold 26px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#ffd60a';
  笔.fillText(玩家1.回合胜 + ' 比 ' + 玩家2.回合胜, 宽 / 2, 287);
  画两钮(430, '再来一场（空格）', '回菜单');
}

function 画剧情胜利() {
  笔.fillStyle = 'rgba(28,16,48,0.85)'; 笔.fillRect(0, 0, 宽, 高);
  const 章 = 剧情章节[战场.章 - 1];
  笔.textAlign = 'center'; 笔.textBaseline = 'middle';
  笔.font = '52px serif'; 笔.fillText('⚔', 宽 / 2, 140);
  笔.font = 'bold 30px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#7bed9f';
  笔.fillText(席档案[章.boss].名 + ' 被讨伐！', 宽 / 2, 215);
  if (新皮肤号 !== null) {
    const 皮 = 皮肤列表[新皮肤号];
    笔.fillStyle = 皮.色; 笔.beginPath(); 笔.arc(宽 / 2, 285, 24, 0, 6.29); 笔.fill();
    画头纹(皮.纹, 宽 / 2, 285);
    笔.font = 'bold 18px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#ffd60a';
    笔.fillText('解锁皮肤技能：' + 皮.名, 宽 / 2, 335);
  }
  笔.font = '16px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#ffb35c';
  笔.fillText('炸弹党损失了第 ' + 战场.章 + ' 位十二席……', 宽 / 2, 380);
  画两钮(470, '下一席（空格）', '回剧情');
}

function 画剧终() {
  笔.fillStyle = 'rgba(24,14,42,0.92)'; 笔.fillRect(0, 0, 宽, 高);
  笔.textAlign = 'center'; 笔.textBaseline = 'middle';
  笔.font = '48px serif'; 笔.fillText('🎬', 宽 / 2, 120);
  笔.font = 'bold 32px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#ffd60a';
  笔.fillText('第一季 · 完', 宽 / 2, 195);
  const 词 = ['炸弹党的十二席，全军覆没。', '你活动了下手腕，', '窗外的城市灯火像擂台的灯。', '再也没有刺客会来了——', '（大王：新的敌人，等你点名。）'];
  笔.font = '17px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#e8e8f0';
  词.forEach((行, i) => 笔.fillText(行, 宽 / 2, 260 + i * 32));
  笔.fillStyle = '#5a4a8a'; 笔.fillRect(140, 500, 200, 50);
  笔.strokeStyle = '#7ee8fa'; 笔.lineWidth = 2; 笔.strokeRect(140, 500, 200, 50);
  笔.font = 'bold 20px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#fff';
  笔.fillText('回主菜单（空格）', 宽 / 2, 525);
}

function 画失败() {
  笔.fillStyle = 'rgba(28,16,48,0.85)'; 笔.fillRect(0, 0, 宽, 高);
  笔.textAlign = 'center'; 笔.textBaseline = 'middle';
  笔.font = '52px serif'; 笔.fillText('💫', 宽 / 2, 140);
  笔.font = 'bold 34px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#ff4d6d';
  笔.fillText('你被揍倒了……', 宽 / 2, 215);
  笔.font = '16px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#ffb35c';
  const 嘲 = 玩家2.席 === '气运之主' ? '气运之主：运气，也是一种实力。' :
    玩家2.席 === '独眼龙' ? '独眼龙：我的眼睛看到了你的败局。' :
    玩家2.席 === '黑头子' ? '黑头子：小弟们，收工！' :
    玩家2.席 === '瞬影' ? '瞬影：你连我的影子都没碰到。' :
    玩家2.席 === '疾风' ? '疾风：你连风的声音都没听到。' :
    玩家2.席 === '变色龙' ? '变色龙：镜子里的你，也不过如此。' : '机器人：战术模拟完毕。';
  笔.fillText(嘲, 宽 / 2, 265);
  画两钮(470, '再试一次（空格）', '不打了');
}

function 画两钮(y, 左字, 右字) {
  笔.fillStyle = '#5a4a8a'; 笔.fillRect(60, y, 160, 50); 笔.fillRect(260, y, 160, 50);
  笔.strokeStyle = '#7ee8fa'; 笔.lineWidth = 2;
  笔.strokeRect(60, y, 160, 50); 笔.strokeRect(260, y, 160, 50);
  笔.font = 'bold 18px system-ui, "PingFang SC", sans-serif'; 笔.fillStyle = '#fff'; 笔.textAlign = 'center';
  笔.fillText(左字, 140, y + 25); 笔.fillText(右字, 340, y + 25);
}

/* 开机！ */
requestAnimationFrame(某帧过去了);
</script>
</body>
</html>
